<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ビュフォンの針</title>
<style>
:root{--paper:#f7f5f0;--ink:#2a2a2a;--mute:#8a8579;--rule:#e2ddd2;--acc:#2f6f6a;--acc2:#8c3a3f;--sand:#c9b38f;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","BIZ UDPMincho",serif}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#cv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none;cursor:default}
#bar{flex:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);background:var(--paper)}
button{min-width:44px;min-height:42px;padding:0 16px;font-family:var(--sans);font-weight:500;font-size:16px;letter-spacing:.04em;line-height:1;color:var(--ink);background:transparent;
  border:1px solid #cfc8bb;border-radius:999px;cursor:pointer;touch-action:manipulation;transition:background .18s,border-color .18s,color .18s;font-variant-numeric:tabular-nums}
button:hover{border-color:#a9a192}
button:active{background:rgba(42,42,42,.06)}
button.on{background:rgba(47,111,106,.10);border-color:var(--acc);color:var(--acc)}
button.main{background:var(--acc);border-color:var(--acc);color:#f7f5f0}
button.main:active{background:#245752}
button.main.on{background:#245752;color:#f7f5f0}
button:disabled{opacity:.32;cursor:default}
.sep{flex:none;width:1px;height:24px;background:var(--rule);margin:0 6px}
@media (max-width:560px){button{font-size:15px;padding:0 12px}}
#tip{position:fixed;left:50%;top:16px;transform:translate(-50%,-6px);max-width:min(88vw,900px);box-sizing:border-box;padding:14px 26px;background:rgba(247,245,240,.96);border:1px solid var(--rule);border-left:3px solid var(--acc);border-radius:4px;
  font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.6;color:var(--ink);text-align:left;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5;box-shadow:0 6px 24px rgba(60,50,30,.08)}
#tip.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){#tip{font-size:18px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="bar">
  <button id="bQ">?</button><span class="sep"></span>
  <button id="b1" class="main">×1</button><button id="b10">×10</button><button id="b100">×100</button><button id="b1000">×1000</button><button id="bAuto">自動</button>
  <button id="bReset">リセット</button>
</div>
</div>
<div id="tip">線にかかる確率は 2ℓ/(πd)。だから回数を数えると π がわかる。</div>
<script>
"use strict";
/* ===== 共通: 色・乱数・描画・スライダー ===== */
const PAPER="#f7f5f0",INK="#2a2a2a",GR="#8a8579",LG="#ebe6dc",RED="#8c3a3f",OR="#b5824a",BL="#4f6d8a",GN="#2f6f6a",PK="#a8707a",PU="#7a6a8f",YE="#b8a050",ACC="#2f6f6a";
const DK={"#b5824a":"#7d5a33","#4f6d8a":"#36506a","#2f6f6a":"#24524e","#a8707a":"#7a4b54","#7a6a8f":"#574a69","#8c3a3f":"#7a2f34","#b8a050":"#7f6d33","#2a2a2a":"#2a2a2a","#8a8579":"#8a8579"};
const LT={"#4f6d8a":"#dde4ea","#b5824a":"#efe2d0","#2f6f6a":"#d6e5e2","#a8707a":"#eedfe1","#7a6a8f":"#e5e0ec","#8c3a3f":"#ecd8d8","#b8a050":"#efe8cf"};
const FONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif';
const SERIF='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","BIZ UDPMincho",serif';
const TAU=Math.PI*2;
/* xoshiro128** (seeded by crypto) */
const RNG=(()=>{const s=new Uint32Array(4);
  const rotl=(x,k)=>(x<<k)|(x>>>(32-k));
  function next(){const r=Math.imul(rotl(Math.imul(s[1],5),7),9)>>>0;const t=s[1]<<9;s[2]^=s[0];s[3]^=s[1];s[1]^=s[2];s[0]^=s[3];s[2]^=t;s[3]=rotl(s[3],11);return r;}
  function seed(n){let x=n>>>0;for(let i=0;i<4;i++){x=(x+0x9e3779b9)>>>0;let z=x;z=Math.imul(z^(z>>>16),0x85ebca6b);z=Math.imul(z^(z>>>13),0xc2b2ae35);s[i]=(z^(z>>>16))>>>0;}if(!(s[0]|s[1]|s[2]|s[3]))s[0]=1;}
  if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(s);if(!(s[0]|s[1]|s[2]|s[3]))s[0]=1;}else seed(Date.now());
  let spare=null;
  const R={seed,
    random:()=>((next()>>>5)*67108864+(next()>>>6))/9007199254740992,
    int:n=>Math.floor(R.random()*n),
    normal:()=>{if(spare!==null){const v=spare;spare=null;return v;}let u=0;while(u===0)u=R.random();const v=R.random();const r=Math.sqrt(-2*Math.log(u));spare=r*Math.sin(TAU*v);return r*Math.cos(TAU*v);}};
  return R;})();
const rnd=RNG.random;
/* canvas */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const _LW=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,"lineWidth");
Object.defineProperty(ctx,"lineWidth",{get(){return _LW.get.call(this);},set(v){_LW.set.call(this,v<=1.6?v:Math.max(1,v*0.32));}});
function rawLW(v){_LW.set.call(ctx,v);}
let W=1,H=1,dpr=1,M=1,L=30,SM=28,EQ=36,BIG=120,TK=24;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fit(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=Math.max(1,r.width);H=Math.max(1,r.height);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);M=Math.min(W,H);
  L=clamp(0.03*M,15,24);SM=clamp(L*0.62,11,14);EQ=L*1.45;BIG=clamp(0.11*M,40,104);TK=clamp(L*0.68,11,15);
  if(typeof layout==="function")layout();redraw();}
let _rq=false;
function req(){if(_rq)return;_rq=true;requestAnimationFrame(()=>{_rq=false;redraw();});}
function redraw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);ctx.lineJoin="round";ctx.lineCap="round";if(typeof draw==="function")draw();}
const isLand=()=>W>=H*1.05;
/* text */
function fontOf(o,sz){if(o.it)return "italic 400 "+sz+"px "+'"Times New Roman",Times,serif';if(o.serif||(o.w||0)>=800)return (o.w>=800?300:(o.sw||400))+" "+sz+"px "+SERIF;const w=o.w||700;return (w>=700?500:w)+" "+sz+"px "+FONT;}
function T(s,x,y,o={}){const sz=o.size||L;ctx.font=fontOf(o,sz);ctx.letterSpacing=o.ls||"0px";
  ctx.textAlign=o.a||"left";ctx.textBaseline=o.b||"middle";
  if(o.halo){ctx.lineWidth=o.halo===true?Math.max(4,sz*0.12):o.halo;ctx.strokeStyle=PAPER;ctx.lineJoin="round";ctx.strokeText(s,x,y);}
  ctx.fillStyle=o.c||INK;ctx.fillText(s,x,y);return ctx.measureText(s).width;}
function TW(s,o={}){const sz=o.size||L;ctx.font=fontOf(o,sz);ctx.letterSpacing=o.ls||"0px";return ctx.measureText(s).width;}
/* 式: 部品列 [文字列 | {n,d} 分数 | {it:"n"} 変数]. 左端xから、中心yに描く。o.a="center"で中央 */
function EQN(parts,x,y,o={}){const sz=o.size||EQ,c=o.c||INK,fs=sz*0.78;
  const meas=p=>{if(typeof p==="string")return TW(p,{size:sz,serif:1});if(p.it!==undefined)return TW(p.it,{size:sz*1.15,it:1})+sz*0.06;
    return Math.max(TW(String(p.n),{size:fs,serif:1}),TW(String(p.d),{size:fs,serif:1}))+sz*0.3;};
  const tot=parts.reduce((a,p)=>a+meas(p),0);let cx=o.a==="center"?x-tot/2:o.a==="right"?x-tot:x;
  if(o.halo){ctx.fillStyle="rgba(247,245,240,.92)";ctx.fillRect(cx-6,y-sz*1.15,tot+12,sz*2.3);}
  for(const p of parts){const w=meas(p);
    if(typeof p==="string")T(p,cx,y,{size:sz,c,serif:1});
    else if(p.it!==undefined)T(p.it,cx+sz*0.03,y,{size:sz*1.15,c,it:1});
    else{const m=cx+w/2,pc=p.c||c;T(String(p.n),m,y-fs*0.62,{size:fs,c:pc,a:"center",serif:1});T(String(p.d),m,y+fs*0.66,{size:fs,c:pc,a:"center",serif:1});
      ctx.strokeStyle=pc;rawLW(1.2);ctx.beginPath();ctx.moveTo(cx+sz*0.1,y);ctx.lineTo(cx+w-sz*0.1,y);ctx.stroke();}
    cx+=w;}
  return tot;}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
function red(n,d){const g=gcd(n,d);return{n:n/g,d:d/g};}
function fmt(v,k=3){return Number.isFinite(v)?v.toFixed(k):"—";}
function dot(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=c;ctx.fill();}
function line(x1,y1,x2,y2,c=INK,w=5,dash){ctx.setLineDash(dash||[]);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
function soft(x,y,w,h,r,fill,stroke){rrect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;rawLW(1);ctx.stroke();}}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function corner(s,x=20,y){T(s,x,y===undefined?SM+14:y,{size:SM,c:GR,w:500,ls:"0.12em"});}
/* グラフ: r={x,y,w,h}; 目盛り */
function niceStep(range,n=5){const r=range/n,p=Math.pow(10,Math.floor(Math.log10(r))),m=r/p;return (m<1.5?1:m<3?2:m<7?5:10)*p;}
function chart(r,o){const X=v=>r.x+(v-o.x0)/(o.x1-o.x0)*r.w,Y=v=>r.y+r.h-(v-o.y0)/(o.y1-o.y0)*r.h;
  ctx.save();const tf=o.tk||TK;
  const xs=o.xs||niceStep(o.x1-o.x0,o.xn||5),ys=o.ys||niceStep(o.y1-o.y0,o.yn||4);
  const dec=s=>{const t=String(+s.toFixed(6));return t.includes(".")?Math.min(3,t.split(".")[1].length):0;};
  if(o.grid!==false){for(let v=Math.ceil(o.y0/ys-1e-9)*ys;v<=o.y1+1e-9;v+=ys)line(r.x,Y(v),r.x+r.w,Y(v),LG,1);}
  line(r.x,r.y+r.h,r.x+r.w,r.y+r.h,"#a39d90",1.2);if(o.yaxis!==false)line(r.x,r.y,r.x,r.y+r.h,"#a39d90",1);
  if(o.xt!==false)for(let v=Math.ceil(o.x0/xs-1e-9)*xs;v<=o.x1+1e-9;v+=xs){const s=o.xf?o.xf(v):v.toFixed(dec(xs));T(s,X(v),r.y+r.h+tf*1.1,{size:tf,c:GR,a:"center",w:400});}
  if(o.yt!==false&&o.yaxis!==false)for(let v=Math.ceil(o.y0/ys-1e-9)*ys;v<=o.y1+1e-9;v+=ys){const s=o.yf?o.yf(v):v.toFixed(dec(ys));T(s,r.x-10,Y(v),{size:tf,c:GR,a:"right",w:400});}
  if(o.xl)T(o.xl,r.x+r.w,r.y+r.h-tf*0.9,{size:tf,c:GR,a:"right",w:400,ls:"0.08em"});
  if(o.yl)T(o.yl,r.x+10,r.y-tf*0.3,{size:tf,c:GR,b:"bottom",w:400,ls:"0.08em"});
  ctx.restore();return{X,Y};}
function poly(pts,c,w=4,dash){if(pts.length<2)return;ctx.setLineDash(dash||[]);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([]);}
/* 折れ線の記録（点数が多くなったら間引く） */
class Hist{constructor(max=3000){this.max=max;this.reset();}reset(){this.p=[];this.stride=1;this.c=0;}
  push(x,y,force){this.c++;if(force||this.c%this.stride===0){this.p.push([x,y]);if(this.p.length>this.max){this.p=this.p.filter((_,i)=>i%2===0);this.stride*=2;}}}}
/* スライダー（canvas） */
const SL=[];
class Slider{constructor(o){Object.assign(this,{min:0,max:1,step:1,label:"",f:v=>String(v),on:()=>{},vals:null},o);this.v=o.value;SL.push(this);this.x=0;this.y=0;this.w=100;this.show=true;}
  place(x,y,w){this.x=x;this.y=y;this.w=w;}
  get t(){if(this.vals){return this.vals.indexOf(this.v)/(this.vals.length-1);}return (this.v-this.min)/(this.max-this.min);}
  set(t){let v;t=clamp(t,0,1);if(this.vals){v=this.vals[Math.round(t*(this.vals.length-1))];}else{v=this.min+Math.round(t*(this.max-this.min)/this.step)*this.step;v=+v.toFixed(6);}
    if(v!==this.v){this.v=v;this.on(v);req();}}
  setV(v){this.v=v;this.on(v);req();}
  draw(){if(!this.show)return;const {x,y,w}=this,kx=x+this.t*w;
    if(this.label!==null){const lab=this.label;let lx=x;
      if(lab)lx+=T(lab,x,y-L*1.25,{size:L*1.15,it:1,c:INK})+6;T("= "+this.f(this.v),lx,y-L*1.25,{size:L*1.05,c:INK,serif:1});}
    rawLW(2);ctx.lineCap="round";ctx.strokeStyle="#ddd6c9";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();
    ctx.strokeStyle=ACC;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(kx,y);ctx.stroke();
    ctx.save();ctx.shadowColor="rgba(60,50,30,.22)";ctx.shadowBlur=8;ctx.shadowOffsetY=2;dot(kx,y,11,"#fffdf8");ctx.restore();
    ctx.strokeStyle=ACC;rawLW(1.5);ctx.beginPath();ctx.arc(kx,y,11,0,TAU);ctx.stroke();dot(kx,y,3.2,ACC);
    const e0=this.vals?this.f(this.vals[0]):this.f(this.min),e1=this.vals?this.f(this.vals[this.vals.length-1]):this.f(this.max);
    T(e0,x,y+L*1.15,{size:TK,c:GR,a:"left",w:400});T(e1,x+w,y+L*1.15,{size:TK,c:GR,a:"right",w:400});}
  hit(px,py,tol){return this.show&&px>this.x-tol-10&&px<this.x+this.w+tol+10&&Math.abs(py-this.y)<tol+8;}}
/* ポインタ */
const drags=new Map();
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
cv.addEventListener("pointerdown",e=>{e.preventDefault();const p=pos(e),tol=e.pointerType==="mouse"?22:34;
  for(const s of SL){if(s.hit(p.x,p.y,tol)){drags.set(e.pointerId,{s});s.set((p.x-s.x)/s.w);try{cv.setPointerCapture(e.pointerId);}catch(_){}return;}}
  if(typeof onDown==="function"&&onDown(p,tol,e)!==false){drags.set(e.pointerId,{f:1});try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
cv.addEventListener("pointermove",e=>{const d=drags.get(e.pointerId);const p=pos(e);
  if(!d){if(e.pointerType==="mouse")cv.style.cursor=SL.some(s=>s.hit(p.x,p.y,22))?"pointer":(typeof hover==="function"&&hover(p))?"pointer":"default";return;}
  e.preventDefault();if(d.s)d.s.set((p.x-d.s.x)/d.s.w);else if(typeof onMove==="function")onMove(p,e);});
function _end(e){const d=drags.get(e.pointerId);if(!d)return;drags.delete(e.pointerId);if(d.f&&typeof onUp==="function")onUp(pos(e),e);}
cv.addEventListener("pointerup",_end);cv.addEventListener("pointercancel",_end);
cv.addEventListener("contextmenu",e=>e.preventDefault());
/* ボタン */
const $=id=>document.getElementById(id);
function onClick(id,f){$(id).addEventListener("click",f);}
function tabs(ids,cur){ids.forEach(i=>$(i).classList.toggle("on",i===cur));}
onClick("bQ",()=>{const t=$("tip");t.classList.toggle("show");$("bQ").classList.toggle("on",t.classList.contains("show"));});
/* 自動 */
let AUTO=false,_af=null;
function autoLoop(step){AUTO=!AUTO;$("bAuto").classList.toggle("on",AUTO);
  if(AUTO){const go=()=>{if(!AUTO)return;step();req();_af=requestAnimationFrame(go);};go();}else cancelAnimationFrame(_af);}
function stopAuto(){if(AUTO){AUTO=false;$("bAuto").classList.remove("on");cancelAnimationFrame(_af);}}
window.addEventListener("resize",fit);window.addEventListener("orientationchange",()=>setTimeout(fit,200));
if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);
function niceUp(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,5,10])if(m*p>=v-1e-9)return m*p;return 10*p;}

/* ===== ビュフォンの針 ===== */

// 線の間隔 d=1、針の長さ ℓ（ℓ≦1）
let n=0,h=0,ND=[],G={};const hist=new Hist(3000);
const sl=new Slider({label:"ℓ",min:0.3,max:1,step:0.1,value:0.8,f:v=>v.toFixed(1)+"d",on:()=>reset(true)});
function reset(keep){n=0;h=0;ND=[];hist.reset();if(!keep){stopAuto();}req();}
const LINES=6; // 場: 0..LINES の帯（縦方向 y∈[0,LINES]）
function drop(m){const l=sl.v;for(let i=0;i<m;i++){const y=rnd()*LINES,x=rnd()*1.6,t=rnd()*Math.PI,dy=Math.sin(t)*l/2,dx=Math.cos(t)*l/2;
  const hitp=Math.floor(y-dy)!==Math.floor(y+dy);n++;if(hitp)h++;ND.push([x,y,dx,dy,hitp]);if(ND.length>3000)ND.splice(0,ND.length-2000);
  hist.push(n,h?2*l*n/h:NaN,i===m-1);}req();}
function layout(){const land=isLand();G.land=land;
  if(land){G.f={x:L*1.5,y:L*2,w:H*0.85,h:H-L*3.2};G.c={x:H*0.85+L*7,y:L*7,w:W-H*0.85-L*8.5,h:H*0.5};sl.place(H*0.85+L*7,H-L*2,W-H*0.85-L*10);}
  else{G.f={x:L*1.5,y:L*2,w:W-L*3,h:H*0.42};G.c={x:L*4,y:H*0.42+L*8,w:W-L*5.5,h:H*0.58-L*15};sl.place(L*2.5,H-L*2,W-L*5);}}
function draw(){const f=G.f,l=sl.v;corner("ビュフォンの針");
  const d=f.h/LINES,sx=f.w/1.6;ctx.save();ctx.beginPath();ctx.rect(f.x,f.y-4,f.w,f.h+8);ctx.clip();
  for(let i=0;i<=LINES;i++)line(f.x,f.y+i*d,f.x+f.w,f.y+i*d,INK,3);
  const many=ND.length>400;
  for(const [x,y,dx,dy,hp] of ND){const cx=f.x+x/1.6*f.w,cy=f.y+y*d;line(cx-dx*d,cy-dy*d,cx+dx*d,cy+dy*d,hp?RED:BL,many?1.5:4);}
  ctx.restore();
  // 式と値
  const tx=G.land?G.c.x+G.c.w/2:W/2,ty=G.land?L*2.6:f.y+f.h+L*2;
  EQN([{it:"π"}," ≈ ",{n:"2ℓ×"+n,d:"d×"+h}," = "],tx-BIG*1.4,ty+(G.land?L*1.2:L*0.6),{a:"right",size:L});
  T(h?fmt(2*l*n/h,4):"—",tx-BIG*1.4,ty+(G.land?L*1.2:L*0.6),{size:clamp(BIG*0.8,40,90),w:800,halo:10});
  // グラフ
  const xmax=niceUp(Math.max(10,n)),c=chart(G.c,{x0:0,x1:xmax,y0:2,y1:4.4,ys:0.4,xl:"本数",yl:"πの推定",xf:v=>v>=10000?(v/10000)+"万":String(v)});
  line(G.c.x,c.Y(Math.PI),G.c.x+G.c.w,c.Y(Math.PI),RED,3,[10,8]);T("π",G.c.x+G.c.w+6,c.Y(Math.PI),{c:RED,it:1});
  ctx.save();ctx.beginPath();ctx.rect(G.c.x,G.c.y,G.c.w,G.c.h);ctx.clip();poly(hist.p.filter(p=>isFinite(p[1])).map(([x,y])=>[c.X(x),c.Y(y)]),BL,3);ctx.restore();
  sl.draw();}
onClick("b1",()=>drop(1));onClick("b10",()=>drop(10));onClick("b100",()=>drop(100));onClick("b1000",()=>drop(1000));
onClick("bAuto",()=>autoLoop(()=>drop(n<500?5:n<20000?200:2000)));onClick("bReset",()=>{sl.v=0.8;reset();});
window.SIM={get:()=>({n,h,est:2*sl.v*n/h,l:sl.v})};

fit();
</script>
