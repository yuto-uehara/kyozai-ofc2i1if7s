/* 式: 部品列 [文字列 | {n,d} 分数 | {it:"n"} 変数]. 左端xから、中心yに描く。o.a="center"で中央 */
function EQN(parts,x,y,o={}){const sz=o.size||EQ,c=o.c||INK,fs=sz*0.78;
  const meas=p=>{if(typeof p==="string")return TW(p,{size:sz,serif:1});if(p.it!==undefined)return TW(p.it,{size:sz*1.15,it:1})+sz*0.06;
    return Math.max(TW(String(p.n),{size:fs,serif:1}),TW(String(p.d),{size:fs,serif:1}))+sz*0.3;};

/* グラフ: r={x,y,w,h}; 目盛り */
function niceStep(range,n=5){const r=range/n,p=Math.pow(10,Math.floor(Math.log10(r))),m=r/p;return (m<1.5?1:m<3?2:m<7?5:10)*p;}

/* スライダー（canvas） */
const SL=[];

/* ポインタ */
