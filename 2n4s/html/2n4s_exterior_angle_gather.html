<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>外角を中心に集める</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Meiryo",sans-serif}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#cv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none;cursor:default}
#bar{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:2px solid #e4e4e4;background:#fff}
button{min-width:64px;min-height:56px;padding:0 18px;font-family:inherit;font-weight:700;font-size:24px;line-height:1;color:#191919;background:#fff;border:3px solid #191919;border-radius:12px;cursor:pointer;touch-action:manipulation}
button:active{background:#eee}
button.main{background:#191919;color:#fff}
button.main:active{background:#444}
button.on{background:#191919;color:#fff}
button:disabled{opacity:.3;cursor:default}
@media (max-width:560px){button{font-size:19px;padding:0 12px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="bar">
  <button id="bAdd" aria-label="頂点を追加">＋頂点</button>
  <button id="bDel" aria-label="頂点を減らす">−頂点</button>
  <button id="bDeg" aria-label="角度を表示">°</button>
  <button id="bGo" class="main">中心に集める</button>
  <button id="bBack">もどす</button>
  <button id="bReset">リセット</button>
</div>
</div>
<script>
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const B={add:bAdd,del:bDel,deg:bDeg,go:bGo,back:bBack,reset:bReset};
const INK="#191919", GRAY="#9a9a9a", RED="#d0362b";
const PAL=["#f08a24","#2f7dd1","#2ea55a","#d6478a","#8a5cd6","#e0b400"];
const TAU=Math.PI*2, DEG=180/Math.PI;
const INIT=[[-0.62,-0.38],[0.18,-0.80],[0.84,-0.12],[0.46,0.66],[-0.50,0.52]]; // irregular pentagon (model units)
const KANJI=["","","","三","四","五","六","七","八","九","十","十一","十二"];

let P=[], showDeg=false, s=1, mode="idle", anim=null, C={x:0,y:0};
let W=0,H=0,dpr=1,k=1,ox=0,oy=0,R=60;

function reset(){P=INIT.map(([x,y])=>({x,y}));s=1;mode="idle";anim=null;drags.clear();draw();}

/* ---------- layout ---------- */
function resize(){
  const r=cv.getBoundingClientRect(); dpr=window.devicePixelRatio||1;
  W=Math.max(1,r.width);H=Math.max(1,r.height);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const m=Math.min(W,H);
  k=m*0.42; ox=W/2; oy=H/2;
  R=Math.max(38,Math.min(95,m*0.11));
  draw();
}
const toS=p=>({x:ox+p.x*k,y:oy+p.y*k});
const toM=(x,y)=>({x:(x-ox)/k,y:(y-oy)/k});
function clampM(p){const mx=(W/2-22)/k,my=(H/2-22)/k;return{x:Math.max(-mx,Math.min(mx,p.x)),y:Math.max(-my,Math.min(my,p.y))};}

/* ---------- geometry ---------- */
function centroid(Q){ // area centroid (falls back to vertex mean)
  let a=0,cx=0,cy=0;
  for(let i=0;i<Q.length;i++){const p=Q[i],q=Q[(i+1)%Q.length],c=p.x*q.y-q.x*p.y;a+=c;cx+=(p.x+q.x)*c;cy+=(p.y+q.y)*c;}
  if(Math.abs(a)<1e-9){let x=0,y=0;Q.forEach(p=>{x+=p.x;y+=p.y});return{x:x/Q.length,y:y/Q.length};}
  return{x:cx/(3*a),y:cy/(3*a)};
}
function segsCross(a,b,c,d){
  const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
  const d1=o(a,b,c),d2=o(a,b,d),d3=o(c,d,a),d4=o(c,d,b);
  return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
}
function analyze(Q){
  const n=Q.length, out=[]; let sum=0;
  for(let i=0;i<n;i++){
    const a=Q[(i-1+n)%n],b=Q[i],c=Q[(i+1)%n];
    const di={x:b.x-a.x,y:b.y-a.y}, dq={x:c.x-b.x,y:c.y-b.y};
    const t=Math.atan2(di.x*dq.y-di.y*dq.x, di.x*dq.x+di.y*dq.y); // signed turn (screen coords)
    out.push({a0:Math.atan2(di.y,di.x),t,dir:di}); sum+=t;
  }
  const sg=sum>=0?1:-1;
  let convex=Math.abs(Math.abs(sum)-TAU)<1e-6;
  for(const e of out){ if(e.t*sg<-0.01/DEG||Math.abs(e.t)>179.5/DEG) convex=false; }   // every turn in the same direction
  for(let i=0;i<n&&convex;i++)for(let j=i+2;j<n;j++){ if(i===0&&j===n-1)continue;
    if(segsCross(Q[i],Q[(i+1)%n],Q[j],Q[(j+1)%n])){convex=false;break;} }
  return{ex:out,sg,convex};
}
function roundTo360(ts){ // integer degrees that add up to exactly 360 (largest remainder)
  const v=ts.map(t=>Math.abs(t)*DEG), f=v.map(Math.floor); let r=360-f.reduce((a,b)=>a+b,0);
  v.map((x,i)=>[x-f[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([_,i])=>{if(r>0){f[i]++;r--;}});
  return f;
}
function colors(n){const c=[];for(let i=0;i<n;i++)c.push(PAL[i%PAL.length]);
  if(n>1&&c[n-1]===c[0]){for(const p of PAL){if(p!==c[0]&&p!==c[n-2]){c[n-1]=p;break;}}}return c;}

/* ---------- drawing ---------- */
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.lineJoin="round"; ctx.lineCap="round";
  const n=P.length, A=analyze(P), col=colors(n), cS=toS(C);
  const V=(mode==="idle")?P.map(toS):P.map(p=>toS({x:C.x+(p.x-C.x)*s,y:C.y+(p.y-C.y)*s}));
  // ghost of the original polygon while gathering
  if(mode!=="idle"){ctx.beginPath();P.map(toS).forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
    ctx.strokeStyle="#e2e2e2";ctx.lineWidth=3;ctx.setLineDash([]);ctx.stroke();}
  // sectors
  for(let i=0;i<n;i++){const e=A.ex[i],v=V[i];
    ctx.beginPath();ctx.moveTo(v.x,v.y);ctx.arc(v.x,v.y,R,e.a0,e.a0+e.t,e.t<0);ctx.closePath();
    const bad=e.t*A.sg<0; ctx.globalAlpha=bad?0.35:0.82; ctx.fillStyle=bad?GRAY:col[i]; ctx.fill(); ctx.globalAlpha=1;}
  // extension rays (dashed, along traversal direction)
  ctx.setLineDash([10,8]);ctx.strokeStyle="#7a7a7a";ctx.lineWidth=3;
  for(let i=0;i<n;i++){const e=A.ex[i],v=V[i],L=R+34;ctx.beginPath();ctx.moveTo(v.x,v.y);ctx.lineTo(v.x+Math.cos(e.a0)*L,v.y+Math.sin(e.a0)*L);ctx.stroke();}
  ctx.setLineDash([]);
  // polygon sides
  if(s>0.002){ctx.beginPath();V.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
    ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.stroke();}
  // end: full circle outline + rays
  if(mode==="gathered"){
    ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cS.x,cS.y,R,0,TAU);ctx.stroke();
    for(const e of A.ex){ctx.beginPath();ctx.moveTo(cS.x,cS.y);ctx.lineTo(cS.x+Math.cos(e.a0)*R,cS.y+Math.sin(e.a0)*R);ctx.stroke();}
  }
  // vertices
  if(mode==="idle"){for(const v of V){ctx.beginPath();ctx.arc(v.x,v.y,10,0,TAU);ctx.fillStyle=INK;ctx.fill();
      ctx.beginPath();ctx.arc(v.x,v.y,4,0,TAU);ctx.fillStyle="#fff";ctx.fill();}}
  else if(s>0.002){for(const v of V){ctx.beginPath();ctx.arc(v.x,v.y,6,0,TAU);ctx.fillStyle=INK;ctx.fill();}}
  else{ctx.beginPath();ctx.arc(cS.x,cS.y,6,0,TAU);ctx.fillStyle=INK;ctx.fill();}
  // degree labels
  const fs=Math.round(Math.max(18,Math.min(30,R*0.34)));
  if(showDeg){
    const lab=A.convex?roundTo360(A.ex.map(e=>e.t)):A.ex.map(e=>Math.round(Math.abs(e.t)*DEG));
    ctx.font=`700 ${fs}px "Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    for(let i=0;i<n;i++){const e=A.ex[i],v=V[i],m=e.a0+e.t/2,d=R+fs*1.1;
      const x=v.x+Math.cos(m)*d,y=v.y+Math.sin(m)*d;
      ctx.lineWidth=5;ctx.strokeStyle="#fff";ctx.strokeText(lab[i]+"°",x,y);
      ctx.fillStyle=(e.t*A.sg<0)?GRAY:shade(col[i]);ctx.fillText(lab[i]+"°",x,y);}
  }
  // corner labels
  ctx.textAlign="left";ctx.textBaseline="top";ctx.font=`700 ${Math.round(fs*0.95)}px "Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif`;ctx.fillStyle="#666";
  ctx.fillText((KANJI[n]||n)+"角形",14,12);
  if(showDeg&&A.convex){ctx.fillText("外角の和 360°",14,12+fs*1.4);}
  if(!A.convex&&mode==="idle"){ctx.textAlign="center";ctx.fillStyle=RED;ctx.font=`700 ${fs}px "Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif`;ctx.fillText("凸多角形にしてください",W/2,12);}
  // big 360°
  if(mode==="gathered"){
    const big=Math.round(Math.max(44,Math.min(120,Math.min(W,H)*0.12)));
    ctx.font=`800 ${big}px "Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    let y=cS.y-R-(showDeg?fs*2.2:30)-big*0.5; if(y-big*0.5<4) y=cS.y+R+(showDeg?fs*2.2:30)+big*0.5;
    ctx.lineWidth=10;ctx.strokeStyle="#fff";ctx.strokeText("360°",cS.x,y);ctx.fillStyle=INK;ctx.fillText("360°",cS.x,y);
  }
  // buttons
  const idle=mode==="idle";
  B.add.disabled=!idle||n>=12; B.del.disabled=!idle||n<=3; B.go.disabled=!idle||!A.convex;
  B.back.disabled=mode==="idle"; B.deg.classList.toggle("on",showDeg);
}
function shade(h){const n=parseInt(h.slice(1),16);const f=c=>Math.round(c*0.7);
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;}

/* ---------- animation ---------- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function animate(to,dur){
  const from=s,t0=performance.now(); mode="moving";
  anim={to};
  const step=now=>{ if(!anim||anim.to!==to)return;
    const u=Math.min(1,(now-t0)/dur); s=from+(to-from)*ease(u); draw();
    if(u<1)requestAnimationFrame(step); else {anim=null; s=to; mode=to===0?"gathered":"idle"; draw();} };
  requestAnimationFrame(step);
}
function gather(){ if(mode!=="idle"||!analyze(P).convex)return; drags.clear(); C=centroid(P); animate(0,2500); }
function restore(){ if(mode==="idle")return; animate(1,1500); }

/* ---------- editing ---------- */
function addVertex(){
  if(mode!=="idle"||P.length>=12)return;
  let bi=0,bl=-1;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],l=Math.hypot(b.x-a.x,b.y-a.y);if(l>bl){bl=l;bi=i;}}
  const a=P[bi],b=P[(bi+1)%P.length];
  const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}, g=centroid(P); let nx=(b.y-a.y)/bl, ny=-(b.x-a.x)/bl; // outward normal
  if(nx*(m.x-g.x)+ny*(m.y-g.y)<0){nx=-nx;ny=-ny;}
  let h=0.14*bl, q=null;
  for(let it=0;it<6;it++){const c=clampM({x:m.x+nx*h,y:m.y+ny*h});const T=P.slice();T.splice(bi+1,0,c);
    if(analyze(T).convex){q=c;break;} h/=2;}
  P.splice(bi+1,0,q||m); draw();
}
function delVertex(i){ if(mode!=="idle"||P.length<=3)return;
  if(i==null){ // remove the vertex with the smallest exterior angle
    const A=analyze(P);let bi=0,bt=1e9;A.ex.forEach((e,j)=>{const t=e.t*A.sg;if(t<bt){bt=t;bi=j;}});i=bi;}
  P.splice(i,1); drags.clear(); draw(); }

/* ---------- pointer input ---------- */
const drags=new Map(); let lastTap={i:-1,t:0};
function hitVertex(x,y,tol){let bi=-1,bd=tol;P.forEach((p,i)=>{const q=toS(p),d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;bi=i;}});return bi;}
function hitSide(x,y,tol){let best=null,bd=tol;
  for(let i=0;i<P.length;i++){const a=toS(P[i]),b=toS(P[(i+1)%P.length]),dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy;
    const u=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/L2)),px=a.x+u*dx,py=a.y+u*dy,d=Math.hypot(px-x,py-y);
    if(d<bd&&u>0.06&&u<0.94){bd=d;best={i,x:px,y:py};}}return best;}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener("pointerdown",e=>{
  if(mode!=="idle")return; e.preventDefault();
  const p=pos(e), tol=e.pointerType==="mouse"?22:34;
  let i=hitVertex(p.x,p.y,tol);
  if(i>=0){
    const now=performance.now();
    if(lastTap.i===i&&now-lastTap.t<380&&P.length>3){lastTap={i:-1,t:0};delVertex(i);return;}
    lastTap={i,t:now};
  }else{
    const sd=hitSide(p.x,p.y,tol*0.7); if(!sd)return;       // empty space: nothing
    if(P.length>=12)return;
    P.splice(sd.i+1,0,clampM(toM(sd.x,sd.y))); i=sd.i+1; lastTap={i:-1,t:0};
    for(const d of drags.values()) if(d.i>i-1) d.i++;
  }
  const q=toS(P[i]);
  const d={i,dx:q.x-p.x,dy:q.y-p.y,x0:p.x,y0:p.y,moved:false};
  d.timer=setTimeout(()=>{ if(!d.moved&&drags.get(e.pointerId)===d&&P.length>3){drags.delete(e.pointerId);lastTap={i:-1,t:0};delVertex(d.i);} },700);
  drags.set(e.pointerId,d); try{cv.setPointerCapture(e.pointerId);}catch(_){}
  draw();
});
cv.addEventListener("pointermove",e=>{
  const d=drags.get(e.pointerId); if(!d)return; e.preventDefault();
  const p=pos(e); if(Math.hypot(p.x-d.x0,p.y-d.y0)>8){d.moved=true;}
  if(!d.moved)return;
  P[d.i]=clampM(toM(p.x+d.dx,p.y+d.dy)); draw();
});
function end(e){const d=drags.get(e.pointerId);if(d){clearTimeout(d.timer);if(d.moved)lastTap={i:-1,t:0};drags.delete(e.pointerId);}}
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointermove",e=>{ if(e.pointerType!=="mouse"||drags.size)return;const p=pos(e);
  cv.style.cursor=(mode==="idle"&&(hitVertex(p.x,p.y,22)>=0))?"grab":(mode==="idle"&&hitSide(p.x,p.y,15))?"copy":"default";});

B.add.onclick=addVertex; B.del.onclick=()=>delVertex(); B.deg.onclick=()=>{showDeg=!showDeg;draw();};
B.go.onclick=gather; B.back.onclick=restore; B.reset.onclick=reset;
window.addEventListener("resize",resize); window.addEventListener("orientationchange",()=>setTimeout(resize,200));
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
// test hook
window.__ext={setPoly:a=>{if(mode!=="idle")return;P=a.map(([x,y])=>({x,y}));draw();},get:()=>({n:P.length,mode,s,P:P.map(p=>[p.x,p.y]),...(()=>{const A=analyze(P);return{convex:A.convex,sumDeg:A.ex.reduce((a,e)=>a+e.t,0)*DEG,ex:A.ex.map(e=>e.t*DEG)}})()}),toScreen:(x,y)=>toS({x,y}),R:()=>R,center:()=>toS(C)};
reset(); resize();
</script>
</body>
</html>
