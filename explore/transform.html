<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>図形の移動｜動かして確かめる</title><link rel="stylesheet" href="explore.css"></head><body class="with-dock geometry"><header><a class="back" href="../">← 数学のイメージ教材</a><span class="index-link">中１</span></header><nav class="tool-nav" aria-label="教材"><a href="linear.html">一次関数</a><a href="transform.html" aria-current="page">図形の移動</a><a href="cone.html">円錐と展開図</a></nav><main><h1>同じ形のまま、どこへ？</h1><p class="intro">元の三角形と、移動した三角形を見比べる。</p><div class="formula-bar"><div id="move-formula" class="formula" style="font-family:inherit;font-size:19px"></div><span id="mode-label" class="label">平行移動</span></div><div class="workspace"><section class="visual"><div class="visual-head"><h2 id="figure-title">平行移動</h2><small>１目盛り＝１</small></div><svg id="move-graph" class="diagram" viewBox="0 0 360 360" role="img" aria-label="三角形の移動"></svg><div id="move-result" class="caption"></div><div class="legend"><span><span class="dash" style="border-color:#222"></span>元の三角形</span><span><span class="dot"></span>移動した三角形</span></div><div id="move-note" class="note"></div></section>
<section id="controls" class="panel compact" aria-label="図形の移動の操作"><div class="control"><div class="segmented" aria-label="移動の種類"><button data-mode="translate" aria-pressed="true">平行移動</button><button data-mode="rotate" aria-pressed="false">回転移動</button><button data-mode="reflect" aria-pressed="false">対称移動</button></div></div><div class="control"><div class="control-head"><label>対応する点</label><small>元の点 → 移動した点</small></div><div class="point-buttons"><button data-point="0" aria-pressed="true">A → A′</button><button data-point="1" aria-pressed="false">B → B′</button><button data-point="2" aria-pressed="false">C → C′</button></div></div>
<div id="translate-controls"><div class="control"><div class="control-head"><label for="dx">横に移動</label><output id="dx-out" class="control-output"></output></div><input id="dx" class="range" type="range" min="-4" max="2" step="1" value="-3" aria-label="横の移動量"></div><div class="control"><div class="control-head"><label for="dy">縦に移動</label><output id="dy-out" class="control-output"></output></div><input id="dy" class="range" type="range" min="-3" max="3" step="1" value="2" aria-label="縦の移動量"></div></div>
<div id="rotate-controls" hidden><div class="control"><div class="control-head"><label for="angle">回転する角度</label><output id="angle-out" class="control-output"></output></div><input id="angle" class="range" type="range" min="-180" max="180" step="15" value="90" aria-label="回転角度"><p class="subnote">＋は反時計回り ↶ ／ −は時計回り ↷</p></div><div class="control"><label>回転の中心 O</label><div class="two-inputs"><div><label for="cx">x 座標</label><select id="cx" class="inline-select"><option value="-1">−1</option><option value="0" selected>0</option><option value="1">1</option></select></div><div><label for="cy">y 座標</label><select id="cy" class="inline-select"><option value="-1">−1</option><option value="0" selected>0</option><option value="1">1</option></select></div></div></div></div>
<div id="reflect-controls" hidden><div class="control"><label for="axis">対称の軸</label><select id="axis" class="inline-select"><option value="vertical">縦の線 x＝k</option><option value="horizontal">横の線 y＝k</option><option value="diagonal">斜めの線 y＝x−k</option></select></div><div class="control"><div class="control-head"><label for="offset">軸の位置 k</label><output id="offset-out" class="control-output"></output></div><input id="offset" class="range" type="range" min="-1" max="1" step=".5" value="0" aria-label="対称の軸の位置"></div></div><div class="control row spread"><button id="move-play" class="primary">動きを見る</button><button id="move-reset">はじめに戻す</button></div><p id="animation-note" class="subnote">ドラッグしなくても、すべて操作できます。</p></section></div><p class="footnote">対応点は A と A′、B と B′、C と C′。どの移動でも辺の長さと角の大きさは変わりません。</p></main><a class="jump-controls" href="#controls">移動を変える ↓</a><aside class="quick-dock" aria-label="いつでも使える移動操作"><div class="segmented"><button data-mode="translate" aria-pressed="true">平行</button><button data-mode="rotate" aria-pressed="false">回転</button><button data-mode="reflect" aria-pressed="false">対称</button></div><div id="dock-translate"><div class="dock-row"><label for="dock-dx">横の量</label><input id="dock-dx" data-mirror="dx" type="range" min="-4" max="2" step="1" aria-label="横の量を動かす"><output data-dock-output="dx"></output></div><div class="dock-row"><label for="dock-dy">縦の量</label><input id="dock-dy" data-mirror="dy" type="range" min="-3" max="3" step="1" aria-label="縦の量を動かす"><output data-dock-output="dy"></output></div></div><div id="dock-rotate" hidden><div class="dock-row"><label for="dock-angle">角度 °</label><input id="dock-angle" data-mirror="angle" type="range" min="-180" max="180" step="15" aria-label="角度 °を動かす"><output data-dock-output="angle"></output></div><div class="dock-row"><span class="tiny">中心 O</span><a href="#controls" style="font-size:13px;grid-column:2/4;min-height:44px;display:flex;align-items:center">中心・対応点を変える ↑</a></div></div><div id="dock-reflect" hidden><div class="dock-row"><label for="dock-axis">軸の向き</label><select id="dock-axis" data-mirror="axis"><option value="vertical">縦 x＝k</option><option value="horizontal">横 y＝k</option><option value="diagonal">斜め y＝x−k</option></select></div><div class="dock-row"><label for="dock-offset">軸の位置</label><input id="dock-offset" data-mirror="offset" type="range" min="-1" max="1" step="0.5" aria-label="軸の位置を動かす"><output data-dock-output="offset"></output></div></div></aside><script src="explore-math.js"></script><script src="transform.js"></script></body></html>
