<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一次関数｜動かして確かめる</title><link rel="stylesheet" href="explore.css"></head><body class="with-dock">
<header><a class="back" href="../">← 数学のイメージ教材</a><span class="index-link">中２</span></header><nav class="tool-nav" aria-label="教材"><a href="linear.html" aria-current="page">一次関数</a><a href="transform.html">図形の移動</a><a href="cone.html">円錐と展開図</a></nav>
<main><h1>傾きと切片を、動かす。</h1><p class="intro">a と b を変えると、直線はどう変わる？</p>
<div class="formula-bar"><div id="linear-formula" class="formula" aria-live="polite"></div><span id="focus-label" class="label">a：傾き</span></div>
<div class="workspace"><section class="visual" aria-label="グラフと表"><div class="visual-head"><h2>表の数を押して、点を選ぶ</h2><small>１目盛り＝１</small></div><svg id="graph" class="diagram" viewBox="0 0 360 360" role="img" aria-label="一次関数のグラフ"></svg><div id="step-result" class="caption"></div><div class="table-wrap"><div class="table-hint">同じ列の x と y が、１つの点になる。</div><table aria-label="xとyの対応表"><tbody id="value-table"></tbody></table></div><div class="legend"><span><span class="dot"></span>選んだ点</span><span><span class="dash"></span>比べるグラフ</span></div><div id="linear-note" class="note"></div></section>
<section id="controls" class="panel" aria-label="一次関数の操作"><div class="control-grid"><div class="control"><div class="control-head"><label for="a">a <small>傾き</small></label><span id="a-read" class="control-output"></span></div><div class="stepper"><button data-step="a" data-delta="-.5" aria-label="傾きを0.5減らす">−</button><input id="a" type="number" min="-2" max="2" step=".5" value="1" inputmode="decimal" aria-label="傾きa"><button data-step="a" data-delta=".5" aria-label="傾きを0.5増やす">＋</button></div><input id="a-range" class="range" type="range" min="-2" max="2" step=".5" value="1" aria-label="傾きスライダー"></div>
<div class="control"><div class="control-head"><label for="b">b <small>切片</small></label><span id="b-read" class="control-output"></span></div><div class="stepper"><button data-step="b" data-delta="-.5" aria-label="切片を0.5減らす">−</button><input id="b" type="number" min="-3" max="3" step=".5" value="1" inputmode="decimal" aria-label="切片b"><button data-step="b" data-delta=".5" aria-label="切片を0.5増やす">＋</button></div><input id="b-range" class="range" type="range" min="-3" max="3" step=".5" value="1" aria-label="切片スライダー"></div></div>
<div class="control"><div class="segmented"><button id="focus-a" aria-pressed="true">傾きを見る</button><button id="focus-b" aria-pressed="false">切片を見る</button></div></div><div class="control"><div class="row wrap"><button id="keep-line">今の線を残して比べる</button><button id="clear-line">比較を消す</button></div><p id="compare-status" class="status">a だけ、b だけを変えて比べよう。</p></div><div class="control row spread"><button id="trace" class="primary">右へ１をたどる</button><button id="reset">はじめに戻す</button></div><p class="subnote">a は −2〜2、b は −3〜3。0.5 ずつ動かせます。</p></section></div><p class="footnote">自作の図による操作教材。元の教材一覧から、ほかの単元も開けます。</p></main><a class="jump-controls" href="#controls">数を変える ↓</a><aside class="quick-dock" aria-label="いつでも使える操作"><div class="dock-row"><label for="dock-a">a 傾き</label><input id="dock-a" data-mirror="a" type="range" min="-2" max="2" step="0.5" aria-label="a 傾きを動かす"><output data-dock-output="a"></output></div><div class="dock-row"><label for="dock-b">b 切片</label><input id="dock-b" data-mirror="b" type="range" min="-3" max="3" step="0.5" aria-label="b 切片を動かす"><output data-dock-output="b"></output></div></aside><script src="explore-math.js"></script><script src="linear.js"></script></body></html>
