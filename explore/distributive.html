<body>
<main>

<h1>分配法則</h1>
<section class="opening-task" aria-label="今回の課題"><p>この式のかっこをはずす</p><div id="task-expression" class="opening-expression">−2(3x−4)</div></section>
<p class="subtitle"><span class="purple">かっこの前の数</span>を、<br><strong>符号もふくめた項</strong>それぞれにかける。</p>
<section class="panel" aria-label="分配法則の手順">
  <div class="step-top"><div class="lesson-steps" aria-label="3つの手順"><span id="phase-0" class="lesson-step current">① 前の数</span><span id="phase-1" class="lesson-step">② 中の項</span><span id="phase-2" class="lesson-step">③ 分配</span></div><span id="step-count" class="step-count">① かっこの前の数字を確認</span></div>
  <p id="step-message" class="step-message"></p>
  <svg id="original" class="original" viewBox="0 0 600 232" role="img" aria-labelledby="formula-title formula-desc">
    <title id="formula-title">−2(3x−4)</title><desc id="formula-desc"></desc>
    <defs><marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M 0 0 L 6.5 3.5 L 0 7 Z" fill="#7643bd"/></marker></defs>
    <g id="arrows"></g><g id="original-equation"></g><g id="moving-factor"></g>
  </svg>
  <div class="expansion">
    <div class="products math" id="expansion-row">
      <div class="product"><p class="product-label blue">左の項に</p><div id="left-term" class="term-box"></div><div id="left-product-result" class="product-result blue" aria-hidden="true"></div></div>
      <span class="plus">＋</span>
      <div class="product"><p class="product-label orange">右の項にも</p><div id="right-term" class="term-box"></div><div id="right-product-result" class="product-result orange" aria-hidden="true"></div></div>
    </div>
    <p id="equation-caption" class="equation-caption"></p>
    <div id="combined" class="combined math hidden" aria-hidden="true"></div>
  </div>
</section>
<div class="nav-buttons" aria-label="手順を進める"><button id="back" type="button">← 戻る</button><button id="play" class="play" type="button" aria-pressed="false">▶ 再生</button><button id="next" class="primary" type="button">次へ →</button></div>
<div class="quick-actions"><div class="utility"><button id="random" class="random" type="button">↻ ランダム</button><button id="reset" class="reset" type="button">最初にもどす</button></div></div>
<section class="settings" aria-label="式の数字を変える">
  <div class="control"><div class="control-top"><label for="factor">かっこの前の数</label><output id="factor-value" for="factor">−2</output></div><input id="factor" type="range" min="-9" max="9" step="1" value="-2" aria-label="かっこの前の係数 a"></div>
  <div class="control"><div class="control-top"><label for="coefficient">x の係数</label><output id="coefficient-value" for="coefficient">3</output></div><input id="coefficient" type="range" min="-9" max="9" step="1" value="3" aria-label="かっこの中の x の係数 b"></div>
  <div class="control"><div class="control-top"><label for="constant">かっこの中の定数</label><output id="constant-value" for="constant">−4</output></div><input id="constant" type="range" min="-9" max="9" step="1" value="-4" aria-label="かっこの中の定数 c"></div>
</section>
<div class="bottom"><p class="note">ランダムでは 0 を除く正負の数が出ます。<br>x は文字のまま計算します。</p></div>
<div id="live" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
</main>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const state={factor:-2,coefficient:3,constant:-4,step:0,playing:false};
let timer=null,epoch=0;
const purple=n=>`<span class="purple">${n}</span>`;
const blue=n=>`<span class="blue">${n}</span>`;
const orange=n=>`<span class="orange">${n}</span>`;
const motionReduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const number=n=>n<0?'−'+Math.abs(n):String(n);
const signedNumber=n=>n<0?'−'+Math.abs(n):'+'+n;
function xTerm(n,explicitPositive=false){
  if(n===0)return explicitPositive?'+0x':'0x';
  return (n<0?'−':explicitPositive?'+':'')+(Math.abs(n)===1?'':Math.abs(n))+'x';
}
const asFactor=(text,negative)=>negative?'('+text+')':text;
function simplified(k,d){
  if(k===0)return number(d);
  return xTerm(k)+(d===0?'':signedNumber(d));
}
function stop(){epoch++;if(timer!==null){clearTimeout(timer);timer=null;}state.playing=false;}
function geometry(a,b,c){
  const texts=[number(a),xTerm(b),signedNumber(c)];
  const width=text=>text.length*49+24;
  const wa=width(texts[0]),wb=width(texts[1]),wc=width(texts[2]);
  let x=38;const ax=x+wa/2;x+=wa+17;const open=x+15;x+=43;const bx=x+wb/2;x+=wb+14;const cx=x+wc/2;x+=wc+15;const close=x+15;x+=50;
  const W=Math.max(600,x);const shift=(W-x)/2;
  return {texts,wa,wb,wc,ax:ax+shift,open:open+shift,bx:bx+shift,cx:cx+shift,close:close+shift,W};
}
function render(animate=false,announce=true){
  const {factor:a,coefficient:b,constant:c,step:s,playing}=state;
  const moving=animate&&!motionReduced(),phase=Math.min(2,s);
  for(const key of ['factor','coefficient','constant']){$(key).value=state[key];$(key+'-value').value=number(state[key]);}
  $('original').setAttribute('data-stage',String(s));
  const stepNames=['① かっこの前の数字を確認','② 符号もふくめて項を確認','③ 分配してかけていく · 左へ','③ 分配してかけていく · 右へ','③ 分配してかけていく · 整理'];
  $('step-count').textContent=stepNames[s];
  for(let i=0;i<3;i++){$('phase-'+i).className='lesson-step'+(i===phase?' current':i<phase?' done':'');$('phase-'+i).setAttribute('aria-current',i===phase?'step':'false');}
  const leftSigned=xTerm(b,true),rightSigned=signedNumber(c);
  const leftChip=`<span class="signed-term blue">${leftSigned}</span>`,rightChip=`<span class="signed-term orange">${rightSigned}</span>`;
  const messages=[`前にある数字は ${purple(number(a))}`,`項は ${leftChip} と ${rightChip}`,`${purple(number(a))} を ${leftChip} にかける`,`${purple(number(a))} を ${rightChip} にもかける`,'符号に気をつけて、整理する'];
  $('step-message').innerHTML=messages[s];
  const g=geometry(a,b,c),{wa,wb,wc,ax,open,bx,cx,close,W,texts}=g;
  $('original').setAttribute('viewBox',`0 0 ${W} 246`);
  const termHighlights=s>=1?`<rect data-term="left" x="${bx-wb/2}" y="129" width="${wb}" height="84" rx="12" class="term-highlight" fill="#e9f3fd" stroke="#2f7dd1"/><rect data-term="right" x="${cx-wc/2}" y="129" width="${wc}" height="84" rx="12" class="term-highlight" fill="#fff1e0" stroke="#f08a24"/>`:'';
  $('original-equation').innerHTML=`<rect x="${ax-wa/2}" y="133" width="${wa}" height="80" rx="14" class="source-ring"/>${termHighlights}<text x="${ax}" y="200" text-anchor="middle" font-size="80" textLength="${wa-24}" lengthAdjust="spacingAndGlyphs" class="source-number">${texts[0]}</text><text x="${open}" y="200" text-anchor="middle" font-size="80" fill="#192b40">(</text><text data-term="left" x="${bx}" y="200" text-anchor="middle" font-size="80" textLength="${wb-24}" lengthAdjust="spacingAndGlyphs" fill="${s>=1?'#195c9f':'#192b40'}">${texts[1]}</text><text data-term="right" x="${cx}" y="200" text-anchor="middle" font-size="80" textLength="${wc-24}" lengthAdjust="spacingAndGlyphs" fill="${s>=1?'#a74e00':'#192b40'}">${texts[2]}</text><text x="${close}" y="200" text-anchor="middle" font-size="80" fill="#192b40">)</text>`;
  let arrows='';
  if(s>=2)arrows+=`<path d="M ${ax} 110 Q ${(ax+bx)/2} 40 ${bx} 110" class="arrow${moving&&s===2?' draw':''}" pathLength="1" marker-end="url(#arrowhead)"/>`;
  if(s>=3)arrows+=`<path d="M ${ax} 110 Q ${(ax+cx)/2} -50 ${cx} 110" class="arrow${moving&&s===3?' draw':''}" pathLength="1" marker-end="url(#arrowhead)"/>`;
  $('arrows').innerHTML=arrows;
  const end=s===2?bx:cx;
  $('moving-factor').innerHTML=moving&&(s===2||s===3)?`<g class="flight move" style="--start-x:${ax}px;--mid-x:${(ax+end)/2}px;--mid-y:${s===2?75:30}px;--end-x:${end}px"><rect x="-38" y="-23" width="76" height="46" rx="22" fill="white" stroke="#7643bd" stroke-width="2"/><text x="0" y="11" text-anchor="middle" font-size="32" fill="#7643bd">${number(a)}</text></g>`:'';
  $('expansion-row').style.visibility=s>=2?'visible':'hidden';$('expansion-row').setAttribute('aria-hidden',String(s<2));
  const outside=asFactor(number(a),a<0),leftFactor=asFactor(xTerm(b),b<0),rightFactor=asFactor(number(c),c<0);
  const leftProduct=outside+'×'+leftFactor,rightProduct=outside+'×'+rightFactor;
  $('left-term').className='term-box'+(s>=2?' left-ready':'')+(leftProduct.length>8?' long':'')+(moving&&s===2?' reveal':'');
  $('right-term').className='term-box'+(s>=3?' right-ready':'')+(rightProduct.length>8?' long':'')+(moving&&s===3?' reveal':'');
  $('left-term').innerHTML=s>=2?`${purple(outside)}<span>×</span>${blue(leftFactor)}`:'<span class="pending">…</span>';
  $('right-term').innerHTML=s>=3?`${purple(outside)}<span>×</span>${orange(rightFactor)}`:'<span class="pending">…</span>';
  const original=number(a)+'('+xTerm(b)+signedNumber(c)+')';
  const captions=['かっこのすぐ前の数を、符号とセットで','＋や − も、それぞれの項の一部','右の項にも、同じ数をかける','2つの積を、＋でつなぐ','かっこをはずせた！'];
  $('equation-caption').textContent=captions[s];
  const k=a*b,d=a*c,result=simplified(k,d);
  const leftResult=k===0?'0':xTerm(k),rightResult=d>0?signedNumber(d):number(d);
  $('left-product-result').textContent='＝'+leftResult;
  $('right-product-result').textContent='＝'+rightResult;
  $('left-product-result').setAttribute('data-result',leftResult);
  $('right-product-result').setAttribute('data-result',rightResult);
  $('left-product-result').setAttribute('aria-hidden',String(s<2));
  $('right-product-result').setAttribute('aria-hidden',String(s<3));
  $('left-product-result').className='product-result blue'+(moving&&s===2?' reveal':'');
  $('right-product-result').className='product-result orange'+(moving&&s===3?' reveal':'');
  let resultHTML='';
  if(k!==0)resultHTML+=blue(xTerm(k));
  if(d!==0)resultHTML+=orange(k!==0?signedNumber(d):number(d));
  if(k===0&&d===0)resultHTML='<span>0</span>';
  $('combined').innerHTML='<span>＝</span>'+resultHTML;
  $('combined').setAttribute('data-result',result);
  $('combined').className='combined math'+(s===4?'':' hidden')+(moving&&s===4?' reveal':'');$('combined').setAttribute('aria-hidden',String(s!==4));
  $('back').disabled=s===0;$('next').disabled=s===4;
  $('play').textContent=playing?'■ 停止':'▶ 再生';$('play').className='play'+(playing?' is-playing':'');$('play').setAttribute('aria-pressed',String(playing));
  $('task-expression').textContent=original;
  $('formula-title').textContent=original;
  const descriptions=[`手順1。${original} の、かっこの前の数は ${number(a)}。`,`手順2。かっこの中の項は、符号をふくめて ${leftSigned} と ${rightSigned}。`,`手順3。${number(a)} を左の項 ${leftSigned} にかけて、${leftProduct}＝${leftResult}。右の項はこれからです。`,`手順3。右の項 ${rightSigned} にもかけて、${rightProduct}＝${rightResult}。左の積は ${leftResult}。`,`手順3の整理。${original}＝${leftProduct}＋${rightProduct}＝${result}。`];
  $('formula-desc').textContent=descriptions[s];
  if(announce)$('live').textContent=descriptions[s]+(playing?' 自動再生中。':'');
}
function schedule(delay){const ticket=epoch;timer=setTimeout(()=>{if(ticket!==epoch||!state.playing)return;timer=null;state.step=Math.min(4,state.step+1);if(state.step===4)state.playing=false;render(true);if(state.playing)schedule(2100);},delay);}
$('next').addEventListener('click',()=>{stop();state.step=Math.min(4,state.step+1);render(true);});
$('back').addEventListener('click',()=>{stop();state.step=Math.max(0,state.step-1);render();});
$('play').addEventListener('click',()=>{if(state.playing){stop();render();return;}stop();state.step=0;state.playing=true;render();schedule(1100);});
$('reset').addEventListener('click',()=>{stop();Object.assign(state,{factor:-2,coefficient:3,constant:-4,step:0});render();});
$('random').addEventListener('click',()=>{
  stop();let pick;
  const choose=()=>{const n=1+Math.floor(Math.random()*9);return Math.random()<.5?-n:n;};
  for(let attempt=0;attempt<6;attempt++){
    pick={factor:choose(),coefficient:choose(),constant:choose()};
    if(pick.factor>0&&pick.coefficient>0&&pick.constant>0)pick.constant=-pick.constant;
    if(pick.factor<0&&pick.coefficient<0&&pick.constant<0)pick.coefficient=-pick.coefficient;
    if(pick.factor!==state.factor||pick.coefficient!==state.coefficient||pick.constant!==state.constant)break;
    if(attempt===5)pick.constant=Math.sign(pick.constant)*(Math.abs(pick.constant)%9+1);
  }
  Object.assign(state,pick,{step:0});render();
});
for(const key of ['factor','coefficient','constant']){
  $(key).addEventListener('input',e=>{stop();state[key]=Math.max(-9,Math.min(9,Math.round(Number(e.target.value))));state.step=0;render(false,false);});
  $(key).addEventListener('change',()=>render());
}
window.addEventListener('pagehide',()=>{stop();render(false,false);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.playing){stop();render(false,false);}});
render(false,false);
})();
</script>
