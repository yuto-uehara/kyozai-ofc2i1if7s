<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>円錐と展開図｜動かして確かめる</title><link rel="stylesheet" href="explore.css"></head><body class="with-dock"><header><a class="back" href="../">← 数学のイメージ教材</a><span class="index-link">中１</span></header><nav class="tool-nav" aria-label="教材"><a href="linear.html">一次関数</a><a href="transform.html">図形の移動</a><a href="cone.html" aria-current="page">円錐と展開図</a></nav><main><h1>円錐の展開図を、調べる。</h1><p id="cone-task" class="intro">半径 r＝3 cm、母線 l＝5 cm。側面の中心角と弧の長さは？</p><div class="formula-bar"><div id="cone-formula" class="formula" style="font-size:23px"></div><span class="label">おうぎ形の<br>中心角</span></div><div class="workspace"><section class="visual"><div class="visual-head"><h2>立体と展開図を見比べる</h2><small>長さの単位：cm</small></div><svg id="cone-graph" class="diagram" style="max-height:600px" viewBox="0 0 360 420" role="img" aria-label="円錐とその展開図"></svg><div id="cone-result" class="caption"></div><div class="compare-note">立体は見取り図。展開図の側面と底面は、同じ縮尺です。</div><div class="note">展開図の底面は、側面から離して表示しています。</div></section>
<section id="controls" class="panel" aria-label="円錐の操作"><div class="control-grid"><div class="control"><div class="control-head"><label for="radius">r <small>底面の半径</small></label><output id="radius-out" class="control-output"></output></div><div class="stepper"><button data-step="radius" data-delta="-.5" aria-label="底面の半径を0.5減らす">−</button><input id="radius" type="number" min=".5" max="4.5" step=".5" value="3" inputmode="decimal" aria-label="底面の半径r"><button data-step="radius" data-delta=".5" aria-label="底面の半径を0.5増やす">＋</button></div><input id="radius-range" class="range" type="range" min=".5" max="4.5" step=".5" value="3" aria-label="底面の半径スライダー"></div>
<div class="control"><div class="control-head"><label for="slant">l <small>母線の長さ</small></label><output id="slant-out" class="control-output"></output></div><div class="stepper"><button data-step="slant" data-delta="-.5" aria-label="母線の長さを0.5減らす">−</button><input id="slant" type="number" min="3.5" max="6" step=".5" value="5" inputmode="decimal" aria-label="母線の長さl"><button data-step="slant" data-delta=".5" aria-label="母線の長さを0.5増やす">＋</button></div><input id="slant-range" class="range" type="range" min="3.5" max="6" step=".5" value="5" aria-label="母線の長さスライダー"></div></div>
<div class="control"><div class="segmented"><button data-look="slant" aria-pressed="false">母線を見る</button><button data-look="arc" aria-pressed="true">弧と円周</button><button data-look="angle" aria-pressed="false">中心角</button></div></div><div class="control"><p class="subnote" style="margin:0 0 8px">半径 l の円全体に対して</p><div id="ratio-formula" class="formula" style="justify-content:flex-start;font-size:23px"></div><p id="ratio-note" class="subnote"></p></div><div class="control row spread"><button id="cone-trace" class="primary">弧と円周をたどる</button><button id="cone-reset">はじめに戻す</button></div><p id="constraint-note" class="subnote">r より l を長くして、円錐の形を保ちます。</p></section></div><p class="footnote">中心角 ＝ 360° × r/l。r＝l では高さが 0 になるため、この教材では r＜l の範囲で操作します。</p></main><a class="jump-controls" href="#controls">長さを変える ↓</a><aside class="quick-dock" aria-label="いつでも使える操作"><div class="dock-row"><label for="dock-radius">r 半径</label><input id="dock-radius" data-mirror="radius" type="range" min="0.5" max="4.5" step="0.5" aria-label="r 半径を動かす"><output data-dock-output="radius"></output></div><div class="dock-row"><label for="dock-slant">l 母線</label><input id="dock-slant" data-mirror="slant" type="range" min="3.5" max="6" step="0.5" aria-label="l 母線を動かす"><output data-dock-output="slant"></output></div></aside><script src="explore-math.js"></script><script src="cone.js"></script></body></html>
