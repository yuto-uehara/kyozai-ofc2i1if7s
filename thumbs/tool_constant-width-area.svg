<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="48" font-size="22">一定幅の面積と真ん中の線</text><text x="240" y="127" font-size="28">面積＝幅×真ん中の線</text><text x="240" y="188" font-size="25" fill="#a64b11">内外の面積の差を変形</text><text x="240" y="242" font-size="17">量の意味と成り立つ条件を確認</text></g></svg>