<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f3"/><g font-family="sans-serif" text-anchor="middle" fill="#65513c" font-size="27"><text x="240" y="39" font-size="26">多項式を単項式で割る</text><text x="240" y="100">(6x³ − 4x²y ＋ 2x) ÷ 2x</text><text x="240" y="157">＝ 3x² − 2xy ＋ 1</text><text x="240" y="222" fill="#a64b11">ただし x ≠ 0</text></g></svg>