<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"><rect width="480" height="270" fill="#f7f5ef"/><g font-family="sans-serif" text-anchor="middle" fill="#252525"><text x="240" y="48" font-size="25">動点の面積と区間式</text><text x="240" y="110" font-size="28">底辺は一定、高さは？</text><text x="240" y="175" font-size="28" fill="#a34700">増える → 一定 → 減る</text><text x="240" y="237" font-size="22">辺が変わる境界で式をつなぐ</text></g></svg>
