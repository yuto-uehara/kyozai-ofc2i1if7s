<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"><rect width="480" height="270" fill="#f7f5ef"/><g font-family="sans-serif" text-anchor="middle" fill="#252525"><text x="240" y="48" font-size="25">指定した文字について解く</text><text x="240" y="110" font-size="30">y ＝ a(x − b)</text><text x="240" y="175" font-size="30" fill="#a34700">x ＝ b ＋ y/a</text><text x="240" y="237" font-size="23">両辺に同じ操作。a ≠ 0。</text></g></svg>
