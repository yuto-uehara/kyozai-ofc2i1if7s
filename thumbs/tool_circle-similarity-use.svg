<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="65" font-size="22">円の図から相似と線分の関係へ</text><text x="240" y="145" font-size="27">同じ弧 → 等しい角 → 相似</text><text x="240" y="220" font-size="19">角・弧・前提を根拠につなぐ</text></g></svg>