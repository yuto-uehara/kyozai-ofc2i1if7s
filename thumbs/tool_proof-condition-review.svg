<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f3"/><text x="28" y="38" font-family="sans-serif" font-size="21" fill="#655f55">証明で使う条件・外せる条件</text><g font-family="sans-serif" font-size="23"><text x="65" y="95">① 平行四辺形　使う</text><text x="65" y="140">② 直角　　　　使う</text><text x="65" y="185" fill="#c75000">③ 等辺　　　　使わない</text></g><text x="240" y="250" text-anchor="middle" font-family="sans-serif" font-size="20">証明で条件を照合・反例で範囲を確認</text></svg>