<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"><rect width="480" height="270" fill="#f7f5ef"/><g font-family="sans-serif" text-anchor="middle" fill="#252525"><text x="240" y="52" font-size="27">多項式を数で割る</text><text x="240" y="111" font-size="29">(3x² − 2xy ＋ 1) ÷ (1/2)</text><text x="240" y="175" font-size="31" fill="#a34700">6x² − 4xy ＋ 2</text><text x="240" y="238" font-size="23">逆数を式全体に掛ける</text></g></svg>
