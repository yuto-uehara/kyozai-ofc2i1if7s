<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"><rect width="480" height="270" fill="#f7f5ef"/><g font-family="sans-serif" text-anchor="middle" fill="#252525"><text x="240" y="48" font-size="26">整理してから代入する</text><text x="240" y="104" font-size="27">(3x＋2y) − (x−y)</text><text x="240" y="158" font-size="31" fill="#a34700">＝ 2x ＋ 3y</text><text x="240" y="207" font-size="22">x＝−3、y＝2 を代入</text><text x="240" y="247" font-size="27">2×(−3)＋3×2＝0</text></g></svg>
