<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="45" font-size="23">xの2乗に比例する関数</text><text x="240" y="120" font-size="34">y＝ax²</text><text x="240" y="181" font-size="25" fill="#a64b11">x → x² → aを掛ける</text><text x="240" y="239" font-size="18">負のxも括弧ごと二乗</text></g></svg>