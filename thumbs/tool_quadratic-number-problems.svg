<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="45" font-size="23">整数の条件と二次方程式</text><text x="240" y="120" font-size="26">連続する整数の積は30</text><text x="240" y="181" font-size="26" fill="#a64b11">未知数 → 立式 → 解く → 吟味</text><text x="240" y="239" font-size="18">条件に合う解は全て残す</text></g></svg>