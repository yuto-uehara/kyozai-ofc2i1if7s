<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="45" font-size="23">三角形の相似条件を確かめる</text><text x="240" y="120" font-size="28">3辺の比・2辺と間の角・2角</text><text x="240" y="181" font-size="25" fill="#a64b11">対応の順序と条件が大切</text><text x="240" y="239" font-size="18">回転・反転しても対応を保つ</text></g></svg>