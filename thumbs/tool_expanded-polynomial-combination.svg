<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f3"/><g font-family="sans-serif" text-anchor="middle" fill="#65513c" font-size="23"><text x="240" y="39" font-size="24">展開と加減を順序よく整理する</text><text x="240" y="94">(x ＋ 2)(x ＋ 3) − (x ＋ 1)²</text><text x="240" y="146">(x² ＋ 5x ＋ 6) − (x² ＋ 2x ＋ 1)</text><text x="240" y="200">＝ 3x ＋ 5</text><text x="240" y="244" font-size="20">括弧の前の負号は全ての項へ</text></g></svg>