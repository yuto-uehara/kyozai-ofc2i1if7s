<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="65" font-size="22">円周角の定理を3つの場合で示す</text><text x="240" y="145" font-size="27">中心角＝2×円周角</text><text x="240" y="220" font-size="19">同じ弧と中心の位置を確かめる</text></g></svg>