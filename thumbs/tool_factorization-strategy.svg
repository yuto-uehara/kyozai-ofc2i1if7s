<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="48" font-size="21">共通因数と置換で因数分解を進める</text><text x="240" y="112" font-size="29">2x²＋10x＋12</text><text x="240" y="153" font-size="20">共通因数2 → 和5・積6</text><text x="240" y="205" font-size="29" fill="#a64b11">2(x＋2)(x＋3)</text><text x="240" y="245" font-size="16">展開して元の式に戻るか確かめる</text></g></svg>