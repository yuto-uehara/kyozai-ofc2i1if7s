<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="45" font-size="21">平方根を使って二次方程式を解く</text><text x="240" y="120" font-size="31">(x＋2)²＝5</text><text x="240" y="181" font-size="27" fill="#a64b11">x＝−2±√5</text><text x="240" y="239" font-size="18">同値な変形で全ての解を求める</text></g></svg>