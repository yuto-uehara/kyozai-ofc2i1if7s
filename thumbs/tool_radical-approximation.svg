<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="45" font-size="21">根号の変形で近似値を求める</text><text x="240" y="122" font-size="29">√8＝2√2 ≈ 2.828</text><text x="240" y="183" font-size="23" fill="#a64b11">等号と近似の記号を使い分ける</text><text x="240" y="239" font-size="18">近似値の誤差も係数倍される</text></g></svg>