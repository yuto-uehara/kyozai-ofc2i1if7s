<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="45" font-size="23">二次方程式と解の意味</text><text x="240" y="120" font-size="31">x²−5x＋6＝0</text><text x="240" y="181" font-size="27" fill="#a64b11">x＝2、3で両辺が等しい</text><text x="240" y="239" font-size="18">整理したときの次数で判断</text></g></svg>