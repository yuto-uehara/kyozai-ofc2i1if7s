<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f3"/><text x="28" y="38" font-family="sans-serif" font-size="21" fill="#655f55">同様に確からしい場合を選ぶ</text><g font-family="sans-serif" font-size="26" text-anchor="middle"><rect x="70" y="65" width="150" height="60" rx="7" fill="#fff" stroke="#ccc"/><text x="145" y="104">表・表</text><rect x="260" y="65" width="150" height="60" rx="7" fill="#f8e8db" stroke="#c75000"/><text x="335" y="104">表・裏</text><rect x="70" y="140" width="150" height="60" rx="7" fill="#f8e8db" stroke="#c75000"/><text x="145" y="179">裏・表</text><rect x="260" y="140" width="150" height="60" rx="7" fill="#fff" stroke="#ccc"/><text x="335" y="179">裏・裏</text></g><text x="240" y="250" text-anchor="middle" font-family="sans-serif" font-size="20">種類数ではなく、等しく起こる場合を数える</text></svg>