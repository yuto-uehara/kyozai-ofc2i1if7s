<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f3"/><g font-family="sans-serif" text-anchor="middle" fill="#65513c" font-size="23"><text x="240" y="39" font-size="24">式のまとまりを置き換えて展開する</text><text x="240" y="94">U ＝ x ＋ y と置く</text><text x="240" y="146">(U ＋ 2)(U − 2) ＝ U² − 4</text><text x="240" y="200">(x ＋ y)² − 4</text><text x="240" y="244" font-size="20">Uを残さず、元の文字に戻す</text></g></svg>