<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="45" font-size="21">式を整理してから根号の値を代入する</text><text x="240" y="122" font-size="29">x²＋4x＋4＝(x＋2)²</text><text x="240" y="183" font-size="23" fill="#a64b11">x＝√5−2をあとから代入</text><text x="240" y="239" font-size="18">小数に丸めず、根号で答える</text></g></svg>