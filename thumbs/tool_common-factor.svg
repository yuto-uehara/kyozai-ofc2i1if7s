<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="48" font-size="23">因数分解の意味と共通因数</text><text x="240" y="112" font-size="30">6x²＋9x</text><text x="240" y="151" font-size="22">↓ 全項に共通する3xを取り出す</text><text x="240" y="200" font-size="30" fill="#a64b11">3x(2x＋3)</text><text x="240" y="241" font-size="17">展開して元の式へ戻るか確かめる</text></g></svg>