<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"><rect width="480" height="270" fill="#f7f5ef"/><g text-anchor="middle" font-family="sans-serif"><text x="240" y="65" font-size="24">反比例モデルと時間の単位</text><text x="240" y="145" font-size="29">2分30秒 ＝ 150秒</text><text x="240" y="220" font-size="23">単位をそろえて積を一定に</text></g></svg>