<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"><rect width="480" height="270" fill="#f7f5ef"/><g font-family="sans-serif" text-anchor="middle" fill="#252525"><text x="240" y="48" font-size="26">連続する3整数の和</text><text x="240" y="110" font-size="30">(n−1) ＋ n ＋ (n＋1)</text><text x="240" y="175" font-size="35" fill="#a34700">＝ 3n</text><text x="240" y="237" font-size="23">nは整数。だから3の倍数。</text></g></svg>
