<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f2"/><g text-anchor="middle" font-family="sans-serif" fill="#3a332a"><text x="240" y="45" font-size="23">y＝ax²の増減と変域</text><text x="240" y="120" font-size="28">端の値と、区間内の0</text><text x="240" y="181" font-size="26" fill="#a64b11">負のaでは大小が逆になる</text><text x="240" y="239" font-size="18">条件を確認して値の変化を読む</text></g></svg>