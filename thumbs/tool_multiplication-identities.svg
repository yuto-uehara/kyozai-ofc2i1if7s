<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#faf8f3"/><g font-family="sans-serif" text-anchor="middle" fill="#65513c"><text x="240" y="39" font-size="26">乗法公式の成り立ちと使い方</text><text x="240" y="95" font-size="26">(U ＋ V)²</text><text x="240" y="148" font-size="26">U² ＋ UV ＋ VU ＋ V²</text><text x="240" y="201" font-size="26">＝ U² ＋ 2UV ＋ V²</text><text x="240" y="244" font-size="20">交差する2つの積を忘れない</text></g></svg>