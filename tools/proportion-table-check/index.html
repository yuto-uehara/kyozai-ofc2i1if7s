<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>比例と反比例｜表の値を比べる</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="../../shared/material-numbers.css?rev=20261013numbers"></head><body><main><a class="back" href="../../index.html">‹ 教材一覧</a><p class="eyebrow">中1 · 比例と反比例</p><h1>この表に合うのは、<br>比例？ 反比例？</h1><p class="intro">割った値・かけた値を比べよう。</p><nav class="presets" aria-label="元の表を選ぶ"><button data-preset="0">表A</button><button data-preset="1">表B</button><button data-preset="2">表C</button><button data-preset="3">表D</button><button data-preset="4">表E</button></nav><section class="panel table-panel"><p class="minor">y の数をタップすると、その組を調べられます。</p><table aria-label="元のx,yと計算結果"><thead><tr><th>x</th><th>y</th><th id="result-head"></th></tr></thead><tbody id="table-body"></tbody></table></section><section class="work-card"><p class="minor">今、調べる計算</p><div id="template" class="template math"></div><div id="calculation" class="calculation math" aria-live="polite"></div><p id="near" class="near"></p></section><button id="compare" class="compare">表の値を、まとめて比べる</button><section id="conclusion" class="panel conclusion" hidden><h2 id="verdict"></h2><div id="equation" class="equation math"></div><p id="reason" class="near"></p><p class="minor">この表の6組についての確認です。ほかの x でも成り立つかは、関係の式や条件で考えます。</p></section><section class="panel"><div class="control-head"><label for="value-range">選んだ y を変える</label><output id="selected-value" class="math"></output></div><p id="edit-caption" class="minor"></p><div class="slider"><button id="minus" aria-label="選んだyを1小さくする">−</button><input id="value-range" type="range" min="-12" max="12" value="-12" step="1"><button id="plus" aria-label="選んだyを1大きくする">＋</button></div><button id="reset" class="reset">この表を元に戻す</button></section><p class="minor">x = 0 は、0で割れないのでこの表には入れていません。</p><div class="dock" aria-label="比べる計算"><button data-operation="ratio" aria-pressed="true">y ÷ x を比べる</button><button data-operation="product" aria-pressed="false">x × y を比べる</button></div></main><script src="app.js?rev=20261016arrows"></script><script src="../screen-fit.js?rev=20261016arrows"></script><script src="../../shared/material-numbers.js?rev=20261013numbers"></script></body></html>
