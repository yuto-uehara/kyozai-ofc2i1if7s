<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かっこ・分数・小数の方程式</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n3s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>かっこ・分数・小数の方程式</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">元の式と、両辺を同じ倍にした式を比べる</h2><p class="lesson-given">解を変えずに計算しやすい式へ。xを動かし、両辺が等しくなる値を確かめよう。</p><div class="lesson-visual"><div id="original-equation" class="equation math"></div><p id="operation" class="lesson-note"></p><div id="changed-equation" class="equation math"></div><div id="bars"></div></div><div class="lesson-settings"><label for="example">式</label><select id="example"><option value="0">かっこ</option><option value="1">分数</option><option value="2">小数</option><option value="3">分母2と3</option></select><label for="multiple">両辺の倍率</label><select id="multiple"><option>1</option><option>2</option><option>4</option><option>6</option><option>10</option><option>20</option></select></div><div class="lesson-controls"><label for="candidate">確かめる x <output id="candidate-value"></output></label><input id="candidate" type="range" min="0" max="10" step="1" value="4"></div><p id="values" class="lesson-state math"></p><p id="judgment" class="lesson-state" role="status"></p><p id="hint" class="lesson-state"></p></div></section><section class="panel"><h2>元の式へ代入して解を確かめる</h2><div id="solution-work" class="near math"></div><p id="verification" class="near"></p><p class="near">等式の両辺を同じ0でない数でかけても、解は変わりません。0倍するとどんなxでも0＝0になり、元の条件を失います。</p><p class="near">かっこを外すときは、中のすべての項に分配します。分母払いも、両辺のすべての項に同じ数をかけます。</p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js"></script><script src="../screen-fit.js"></script><script src="../../shared/material-numbers.js?rev=20261016g"></script></body></html>
