<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>三角形の合同条件｜同じ条件で、形は決まる？</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="../../shared/material-numbers.css?rev=20261013numbers"></head><body><main><header><a class="back" href="../../index.html">‹ 教材一覧</a><p class="eyebrow">中2 · 三角形の合同</p><h1>同じ条件で、<br>三角形の形は決まる？</h1><p class="intro">長さや角を変えて、できる三角形を比べよう。</p></header><nav class="modes" aria-label="条件を選ぶ"><button data-mode="sss" aria-pressed="true">3つの辺</button><button data-mode="sas">2辺と間の角</button><button data-mode="asa">1辺と両端の角</button><button data-mode="ssa">2辺と別の角</button></nav><section class="task"><p id="criterion" class="criterion"></p><div id="given" class="given math" aria-live="polite"></div></section><section class="diagram-card"><div class="result-head"><span id="count" class="result" aria-live="polite"></span><button id="reset" class="quiet">はじめから</button></div><p id="result-note" class="near-note"></p><div id="diagram"></div><div class="compare-actions"><button id="overlay">重ねて比べる</button><button id="position">向きを変える</button></div><p id="diagram-note" class="small"></p></section><section class="controls" aria-label="条件を変える"><p class="small">調べたい数を変える</p><div id="sliders"></div></section><details><summary>合同条件を確かめる</summary><div class="explanation"><p>① 3組の辺がそれぞれ等しい</p><p>② 2組の辺と、その間の角がそれぞれ等しい</p><p>③ 1組の辺と、その両端の角がそれぞれ等しい</p><p class="small">この3つが、三角形の合同条件。「2辺と別の角」は、2つの形ができる場合があるので合同条件にはなりません。</p></div></details><footer>形の数は、場所・向き・裏返しの違いを除いて数えています。<br>図を重ねる操作は条件を確かめる補助です。</footer></main><script src="app.js?rev=20261016arrows"></script><script src="../screen-fit.js?rev=20261016arrows"></script><script src="../../shared/material-numbers.js?rev=20261013numbers"></script></body></html>
