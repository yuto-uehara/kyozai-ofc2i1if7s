<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字式の表し方</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css"><link rel="stylesheet" href="style.css?rev=20261017split"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main class="fit-shell"><header class="fit-head"><a class="back" href="../../index.html#c1n2s">‹ 教材一覧</a><h1>文字式の表し方</h1></header><div class="fit-stage"><section data-fit-panel class="panel" id="notation-panel"><div class="lesson-unit"><h2 class="lesson-title">積・商・累乗を文字式で書く</h2><p class="lesson-given">書き方を変えても、表す量は同じ。aの値を変えて確かめよう。ここではb＝2です。</p><div class="lesson-visual"><div id="notation-original" class="notation-equation"></div><div id="notation-short" class="notation-equation"></div><p id="notation-rule" class="lesson-note"></p></div><div class="lesson-settings"><label for="notation-case">書き方</label><select id="notation-case"><option value="0">数と文字の積</option><option value="1">文字どうしの積</option><option value="2">係数1</option><option value="3">係数−1</option><option value="4">同じ文字の積</option><option value="5">数で割る</option><option value="6">和を割る</option><option value="7">文字で割る</option></select></div><div class="lesson-controls"><label for="notation-a">代入するa <output id="notation-a-out"></output></label><input id="notation-a" type="range" min="-3" max="3" value="2"></div><p id="notation-value" class="lesson-state math"></p><p id="notation-note" class="lesson-state" role="status"></p></div></section></div><footer class="fit-footer"><button id="reset">はじめから</button></footer></main><script src="app.js?rev=20261017split"></script><script src="../../shared/material-numbers.js?rev=20261017split"></script></body></html>
