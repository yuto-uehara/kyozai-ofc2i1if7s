<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>比例と反比例｜xを何倍にすると？</title><link rel="stylesheet" href="style.css"></head><body><main><a class="back" href="../../index.html">‹ 教材一覧</a><p class="eyebrow">中1 · 比例と反比例</p><h1>x を何倍にすると、<br>y はどう変わる？</h1><nav class="modes" aria-label="関係を選ぶ"><button data-mode="proportion" aria-pressed="true">比例</button><button data-mode="inverse" aria-pressed="false">反比例</button></nav><section class="formula-card"><div id="formula" class="equation math"></div><p id="rule" class="near"></p></section><section class="panel"><div class="control-head"><label>比例定数 a</label><output id="a-value" class="math"></output><button id="reset" class="quiet">はじめから</button></div><div class="slider"><button id="a-minus" aria-label="aを1つ小さい値へ">−</button><input id="a-range" type="range" min="0" max="13" step="1" value="9" aria-label="比例定数a"><button id="a-plus" aria-label="aを1つ大きい値へ">＋</button></div><p class="minor">正・負の a を比べよう。ここでは a ≠ 0。</p></section><section class="panel"><h2>x の変え方を選ぶ</h2><div class="factors" aria-label="xの倍率"><button data-factor="0.5">× <span class="frac"><span>1</span><span>2</span></span></button><button data-factor="2" aria-pressed="true">× 2</button><button data-factor="3">× 3</button><button data-factor="-1">×（−1）</button></div><table aria-label="元から先への値の変化"><thead><tr><th></th><th><button data-point="from">元の値</button></th><th>変え方</th><th><button data-point="to">移った先</button></th></tr></thead><tbody id="table-body"></tbody></table><p id="table-note" class="near"></p><div id="invariant" class="invariant math"></div></section><section class="panel graph-panel"><div id="coordinate" class="coordinate math" aria-live="polite"></div><div id="graph"></div><p class="minor">赤枠の x・y → オレンジの点。表の数を押すと切り替わります。</p><p id="graph-note" class="near"></p></section><div class="dock"><label for="x-range">元の x <output id="x-value" class="math"></output></label><div class="slider"><button id="x-minus" aria-label="元のxを1つ小さい値へ">−</button><input id="x-range" type="range" min="0" max="10" step="1" value="6"><button id="x-plus" aria-label="元のxを1つ大きい値へ">＋</button></div></div></main><script src="app.js"></script></body></html>
