<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>球の表面積</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="../solid-surface-area/style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n6s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>球の表面積</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">半径rの円4枚分の面積と比べる</h2><p id="given" class="lesson-given"></p><div class="lesson-visual"><div id="net"></div><p id="net-note" class="lesson-note"></p></div><input id="shape" type="hidden" value="sphere"><input id="part" type="hidden" value="all"><div class="lesson-controls"><label for="size"><span id="size-label">底面の1辺 a</span><output id="size-out"></output></label><input id="size" type="range" min="1" max="5" step="1" value="3"><label for="length" id="length-label"><span id="length-name">高さ h</span><output id="length-out"></output></label><input id="length" type="range" min="1" max="10" step="1" value="4"></div><p id="area-parts" class="lesson-state math"></p><div id="area-formula" class="lesson-state math"></div><p id="area-result" class="lesson-result math" aria-live="polite"></p></div></section><section class="panel"><h2>半径から球の表面積を求める</h2><p class="near">球はそのまま平面に展開できません。表面積4πr²を、半径rの円4枚分の面積と比較します。</p><p class="near">半径を2倍にすると、表面積は4倍になります。</p><p class="minor">表面積の単位はcm²。体積のcm³とは区別します。</p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="../solid-surface-area/app.js?rev=20261017spherearea"></script><script src="../screen-fit.js?rev=20261017steps"></script><script src="../../shared/material-numbers.js?rev=20261017spherearea"></script></body></html>
