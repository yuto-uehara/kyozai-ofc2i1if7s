<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直線と平面の位置関係</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n6s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>直線と平面の位置関係</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">空間での交わりを確かめる</h2><p class="lesson-given">立方体ABCDEFGHで、選んだ辺をふくむ直線や面をふくむ平面の関係を確かめよう。</p><div class="lesson-visual"><div id="solid"></div><p class="lesson-note">橙：対象1　青：対象2。頂点名を見て比べよう。</p></div><div class="lesson-settings"><label for="mode">比べるもの</label><select id="mode"><option value="lines">直線と直線</option><option value="lineplane">直線と平面</option><option value="planes">平面と平面</option></select></div><div class="lesson-controls"><label for="first">対象1</label><select id="first"></select><label for="second">対象2</label><select id="second"></select><label for="angle">見る向き <output id="angle-value"></output></label><input id="angle" type="range" min="15" max="75" step="5" value="35"></div><p id="classification" class="lesson-result" aria-live="polite"></p><p id="reason" class="lesson-state"></p></div></section><section class="panel"><h2>ねじれの位置は、同じ平面上にない</h2><p class="near">直線どうしは、交わる・平行・ねじれの位置を区別します。同じ直線を選んだときは「同じ直線」です。</p><p class="near">ねじれの位置では、延ばしても交わらず、平行でもありません。投影された図で線が交差して見えるだけでは、空間で交わるとは言えません。</p><p class="near">直線と平面の垂直は、直線が平面に交わり、その交点を通る平面上のどの直線とも直角になる関係です。</p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js"></script><script src="../screen-fit.js"></script><script src="../../shared/material-numbers.js?rev=20261016e"></script></body></html>
