<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbfaf7">
  <title>三角形の内角和｜補助線から角を求める</title>
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="../../shared/material-numbers.css?rev=20261013numbers"></head>
<body>
<main>
  <a class="back" href="../../index.html">‹ 教材一覧</a>
  <p class="eyebrow">中2 · 平行と合同</p>
  <h1>三角形の角を、<br>理由から求めよう。</h1>

  <section class="given-card" aria-labelledby="given-title">
    <h2 id="given-title">元の条件 · 三角形 ABC</h2>
    <div id="given" class="given math"></div>
    <div class="goal"><span>求める角</span><strong class="math">∠ACB = x</strong></div>
  </section>

  <section class="work-card" aria-labelledby="step-title">
    <p id="step-kicker" class="eyebrow"></p>
    <h2 id="step-title" aria-live="polite"></h2>
    <div id="equation" class="equation math"></div>
    <p id="reason" class="reason"></p>
    <div id="diagram" class="diagram"></div>
    <p id="diagram-note" class="diagram-note"></p>
  </section>

  <section id="conclusion" class="conclusion" hidden aria-labelledby="conclusion-title">
    <h2 id="conclusion-title">数を変えても、同じ理由が使える</h2>
    <p class="theorem math">∠A + ∠B + ∠C = 180°</p>
    <p class="minor">平行線の錯角と、直線の角が 180° であることから説明できました。</p>
  </section>

  <details class="controls">
    <summary>元の角度を変えて試す</summary>
    <div class="presets" aria-label="角度の組み合わせ">
      <button type="button" data-preset="0">基本</button>
      <button type="button" data-preset="1">A が鈍角</button>
      <button type="button" data-preset="2">C が鈍角</button>
      <button type="button" data-preset="3">細い形</button>
    </div>
    <div class="angle-control">
      <label for="a-range">∠A <output id="a-value" for="a-range"></output></label>
      <div class="slider">
        <button id="a-minus" type="button" aria-label="角Aを5度小さくする">−</button>
        <input id="a-range" type="range" min="20" max="100" step="5" value="50">
        <button id="a-plus" type="button" aria-label="角Aを5度大きくする">+</button>
      </div>
      <p id="a-range-note" class="range-note"></p>
    </div>
    <div class="angle-control">
      <label for="b-range">∠B <output id="b-value" for="b-range"></output></label>
      <div class="slider">
        <button id="b-minus" type="button" aria-label="角Bを5度小さくする">−</button>
        <input id="b-range" type="range" min="20" max="110" step="5" value="60">
        <button id="b-plus" type="button" aria-label="角Bを5度大きくする">+</button>
      </div>
      <p id="b-range-note" class="range-note"></p>
    </div>
    <p class="minor">数を変えると、最初の問題に戻ります。<br>三角形がつぶれないよう、x は 20° 以上にしています。</p>
  </details>
  <button id="reset" type="button" class="reset">この条件ではじめから</button>

  <nav class="dock" aria-label="説明の段階">
    <button id="prev" type="button">‹ 戻る</button>
    <span id="count" class="count"></span>
    <button id="next" type="button">次へ ›</button>
  </nav>
</main>
<script src="app.js?rev=20261016arrows"></script>
<script src="../screen-fit.js?rev=20261016arrows"></script><script src="../../shared/material-numbers.js?rev=20261013numbers"></script></body>
</html>
