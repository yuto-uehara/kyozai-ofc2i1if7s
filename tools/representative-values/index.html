<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代表値と分布を比べる</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n7s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>代表値と分布を比べる</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">1つの値を変えると、代表値はどう動く？</h2><p id="given" class="lesson-given"></p><div class="lesson-visual"><div id="dotplot"></div><p class="lesson-note">点1つがデータ1個。<br>橙の線：平均値　青の線：中央値</p></div><div class="lesson-settings"><label for="sample">元の並び</label><select id="sample"><option value="0">同じ値をふくむ</option><option value="1">山が2つ</option><option value="2">1つずつ違う</option></select></div><div class="lesson-controls"><label for="outlier">動かす1つの値 <output id="moving-value"></output></label><input id="outlier" type="range" min="0" max="20" step="1" value="8"></div><p id="mean" class="lesson-state math"></p><p id="median" class="lesson-state math"></p><p id="mode" class="lesson-state math" aria-live="polite"></p></div></section><section class="panel"><h2>小さい順で中央を確かめる</h2><p id="sorted" class="near math"></p><p id="median-work" class="near math"></p><p class="near">8個のデータでは、中央の4番目と5番目の平均が中央値です。元の並びの中央ではなく、小さい順に並べて考えます。</p></section><section class="panel"><h2>代表値は分布と一緒に見る</h2><p class="near">平均値はすべての値を使うので、離れた値の影響も受けます。中央値は順番の中央、最頻値は最も多く現れる値です。</p><p class="near">最頻値が2つ以上ある場合もあります。この教材では、すべて1回ずつなら「最頻値なし」と表します。</p><p class="near">1つの代表値だけで判断せず、点の集まり方や広がりも確認しましょう。</p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js?rev=20261016arrows"></script><script src="../screen-fit.js?rev=20261017steps"></script><script src="../../shared/material-numbers.js?rev=20261016d"></script></body></html>
