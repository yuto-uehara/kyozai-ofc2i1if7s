<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>絶対値を距離で確かめる</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css"><link rel="stylesheet" href="style.css?rev=20261016single"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main class="fit-shell"><header class="fit-head"><a class="back" href="../../index.html#c1n1s">‹ 教材一覧</a><h1>絶対値を距離で確かめる</h1></header><div class="fit-stage"><section data-fit-panel class="panel"><div class="number-line-interactive"><div class="number-line-result"><h2>絶対値は0からの距離</h2><div id="distance-graph"></div><p id="distance" class="near math" aria-live="polite"></p><p class="near">絶対値は負になりません。0の絶対値は0です。</p><p class="near">例：−3と＋3の絶対値はどちらも3。<br>ただし、数の大小は −3 ＜ ＋3 です。</p></div><div class="number-line-controls"><div><label for="a">A の数 <output id="av"></output></label><input id="a" type="range" min="-5" max="5" step="0.5" value="-3"></div><div><label for="b">B の数 <output id="bv"></output></label><input id="b" type="range" min="-5" max="5" step="0.5" value="-1"></div></div></div></section></div><footer class="fit-footer"><button id="reset">はじめから</button></footer></main><script src="../signed-number-line/app.js?rev=20261016single"></script><script src="../../shared/material-numbers.js?rev=20261016single"></script></body></html>
