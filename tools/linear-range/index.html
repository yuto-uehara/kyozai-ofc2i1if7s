<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>一次関数｜xの範囲からyの範囲へ</title><link rel="stylesheet" href="style.css"></head><body><main><a class="back" href="../../index.html">‹ 教材一覧</a><p class="eyebrow">中2 · 一次関数</p><h1>x の範囲から、<br>y の範囲を求めよう。</h1><section class="given-card"><div id="formula" class="equation math"></div><p class="minor">x の範囲</p><div id="domain" class="domain math"></div></section><section class="work-card"><p id="step-label" class="step-label"></p><div id="work" class="work math" aria-live="polite"></div><p id="note" class="near"></p></section><section class="panel graph-panel"><div id="graph"></div><p class="legend">● その値をふくむ　○ その値をふくまない</p><p id="graph-note" class="near"></p></section><section class="panel"><table aria-label="xの境界と対応するyの値"><thead><tr><th></th><th>x の境界</th><th>対応する y</th></tr></thead><tbody id="table-body"></tbody></table><p class="minor">○ の境界でも値を計算し、ふくむかどうかは別に考えます。</p></section><section class="panel"><h2>x の範囲を変える</h2><div class="control-head"><label for="lo-range">左端</label><output id="lo-value" class="math"></output><button id="lo-closed" aria-pressed="true">左端をふくむ ●</button></div><div class="slider"><button id="lo-minus" aria-label="左端を小さくする">−</button><input id="lo-range" type="range" min="-5" max="2" step="1" value="-2"><button id="lo-plus" aria-label="左端を大きくする">＋</button></div><div class="control-head"><label for="hi-range">右端</label><output id="hi-value" class="math"></output><button id="hi-closed" aria-pressed="true">右端をふくむ ●</button></div><div class="slider"><button id="hi-minus" aria-label="右端を小さくする">−</button><input id="hi-range" type="range" min="-1" max="5" step="1" value="3"><button id="hi-plus" aria-label="右端を大きくする">＋</button></div></section><details class="panel"><summary>式の a・b を変える</summary><div id="coefficients"></div><p class="minor">a = 0 も比べられます（定数関数）。</p></details><div class="reset-row"><button id="reset">はじめから</button></div><div class="dock"><button id="prev">‹ 戻る</button><span id="count"></span><button id="next">次へ ›</button></div></main><script src="app.js"></script></body></html>
