<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正負の数｜大小と絶対値</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n1s">‹ 教材一覧</a><p class="eyebrow">中1 · 正の数・負の数</p><h1>数の大小と絶対値</h1><section class="panel graph-panel"><h2>数直線で比べる</h2><div id="graph"></div><p id="comparison" class="coordinate math" aria-live="polite"></p><p class="near">数直線では、右にある数ほど大きい。</p><h2>2つの数を動かす</h2><label for="a">A の数 <output id="av"></output></label><input id="a" type="range" min="-5" max="5" step="0.5" value="-3" style="width:100%"><label for="b">B の数 <output id="bv"></output></label><input id="b" type="range" min="-5" max="5" step="0.5" value="-1" style="width:100%"><p class="near">負の数どうし、0、正の数も比べよう。</p></section><section class="panel"><h2>絶対値は0からの距離</h2><div id="distance-graph"></div><p id="distance" class="near math" aria-live="polite"></p><p class="near">絶対値は負になりません。0の絶対値は0です。</p><p class="near">例：−3と＋3の絶対値はどちらも3。<br>ただし、数の大小は −3 ＜ ＋3 です。</p></section><section class="panel"><h2>確かめよう</h2><p class="near">−4 と −2 では、どちらが大きい？</p><div class="modes"><button data-answer="wrong">−4</button><button data-answer="right">−2</button></div><p id="feedback" class="near" role="status"></p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js"></script><script src="../screen-fit.js"></script><script src="../../shared/material-numbers.js"></script></body></html>
