<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正負の数｜大小と絶対値</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css"><link rel="stylesheet" href="style.css?rev=20261016e"><link rel="stylesheet" href="../../shared/material-numbers.css"><link rel="stylesheet" href="number-sets.css"></head><body><main><a class="back" href="../../index.html#c1n1s">‹ 教材一覧</a><p class="eyebrow">中1 · 正の数・負の数</p><h1>数の大小と絶対値</h1><section class="panel graph-panel"><div class="number-line-interactive"><div class="number-line-result"><h2>数直線で比べる</h2><div id="graph"></div><p id="comparison" class="coordinate math" aria-live="polite"></p><p class="near">右にある数ほど大きい。</p></div><div class="number-line-controls"><div><label for="a">A の数 <output id="av"></output></label><input id="a" type="range" min="-5" max="5" step="0.5" value="-3"></div><div><label for="b">B の数 <output id="bv"></output></label><input id="b" type="range" min="-5" max="5" step="0.5" value="-1"></div></div></div></section><section class="panel"><div class="number-line-interactive"><div class="number-line-result"><h2>基準と反対の向き</h2><p id="meaning-given" class="near"></p><div id="meaning-graph"></div><p id="meaning-result" class="coordinate math" aria-live="polite"></p></div><div class="number-line-controls"><div><label for="meaning-scene">場面</label><select id="meaning-scene"><option value="temperature">気温と0℃</option><option value="height">海面と高さ</option><option value="score">基準50点との差</option></select></div><div><label for="meaning-value">基準からの差 <output id="meaning-output"></output></label><input id="meaning-value" type="range" min="-5" max="5" step="1" value="3"></div><p id="meaning-description" class="near"></p></div></div></section><section class="panel"><h2>絶対値は0からの距離</h2><div id="distance-graph"></div><p id="distance" class="near math" aria-live="polite"></p><p class="near">絶対値は負になりません。0の絶対値は0です。</p><p class="near">例：−3と＋3の絶対値はどちらも3。<br>ただし、数の大小は −3 ＜ ＋3 です。</p></section><section class="panel"><h2>確かめよう</h2><p class="near">−4 と −2 では、どちらが大きい？</p><div class="modes"><button data-answer="wrong">−4</button><button data-answer="right">−2</button></div><p id="feedback" class="near" role="status"></p></section><section class="panel" id="sets-panel"><div class="lesson-unit"><h2 class="lesson-title">計算すると、数の範囲はどうなる？</h2><p class="lesson-given">自然数は1、2、3、…。整数には0と負の整数も含まれます。分数・小数まで広げて結果を考えよう。</p><div class="lesson-visual"><div id="sets-diagram"></div><p id="sets-expression" class="lesson-result math"></p></div><div class="lesson-settings"><label for="sets-case">計算例</label><select id="sets-case"><option>2 ＋ 3</option><option>2 × 3</option><option>3 − 5</option><option>3 ÷ 2</option><option>(−3) ＋ 5</option><option>(−3) × 2</option><option>0 ÷ 3</option><option>3 ÷ 0</option></select></div><p id="sets-result" class="lesson-state" role="status"></p><p id="sets-rule" class="lesson-state"></p></div></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js?rev=20261016e"></script><script src="number-sets.js"></script><script src="../screen-fit.js"></script><script src="../../shared/material-numbers.js"></script></body></html>
