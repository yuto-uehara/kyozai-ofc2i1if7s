<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数量の関係を式で表す</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"><link rel="stylesheet" href="function-domain.css"></head><body><main><a class="back" href="../../index.html#c1n2s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>数量の関係を式で表す</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">合計と予算を、図から式へ</h2><p id="given" class="lesson-given"></p><div class="lesson-visual"><div id="bars"></div><p class="lesson-note">橙：回数で変わる料金　黒：固定料金<br>2本の棒は同じ目盛りです。</p></div><div class="lesson-settings"><label for="scenario">場面</label><select id="scenario"><option value="0">遊園地</option><option value="1">レンタル</option><option value="2">印刷</option></select><label for="relation">条件</label><select id="relation"><option value="le">以下</option><option value="lt">未満</option><option value="eq">ちょうど</option><option value="ge">以上</option><option value="gt">より大きい</option></select></div><p id="relationship" class="lesson-result" aria-live="polite"></p><div class="lesson-controls"><label for="x">回数 x（0〜10の整数）<output id="current-x"></output></label><input id="x" type="range" min="0" max="10" step="1" value="4"></div><p id="substitution" class="lesson-state math"></p><p id="judgment" class="lesson-state" role="status"></p></div></section><section class="panel"><h2>言葉と記号をつなぐ</h2><p class="near">以下・以上は、境目の値をふくみます。<br>未満・より大きいは、境目の値をふくみません。</p><p class="near">合計は「1回分 × 回数 ＋ 固定料金」。<br>文字を使った式は、回数を決める前の数量関係を表します。</p></section><section class="panel"><h2>確かめよう</h2><p class="near">「合計が600円未満」に600円はふくまれる？</p><div class="choices"><button data-answer="wrong">ふくまれる</button><button data-answer="right">ふくまれない</button></div><p id="feedback" class="near" role="status"></p></section><section class="panel" id="function-panel"><div class="lesson-unit"><h2 class="lesson-title">xを決めると、yは一つに決まる？</h2><p id="function-given" class="lesson-given"></p><div class="lesson-visual"><div id="function-diagram"></div><p id="function-output" class="lesson-result"></p></div><div class="lesson-settings"><label for="function-case">場面</label><select id="function-case"><option value="tickets">券の枚数と代金</option><option value="ribbon">リボンの長さと代金</option><option value="two">絶対値だけが条件</option></select></div><div class="lesson-controls"><label for="function-x">x <output id="function-x-out"></output></label><input id="function-x" type="range" min="0" max="5" step="1" value="2"></div><p id="function-domain" class="lesson-state"></p><p id="function-rule" class="lesson-state" role="status"></p></div></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js"></script><script src="function-domain.js"></script><script src="../screen-fit.js"></script><script src="../../shared/material-numbers.js?rev=20261016c"></script></body></html>
