<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>比例と反比例｜1組の値から式を決める</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="../../shared/material-numbers.css?rev=20261013numbers"></head><body><main><a class="back" href="../../index.html">‹ 教材一覧</a><p class="eyebrow">中1 · 比例と反比例</p><h1>この1組から、<br>式を決めよう。</h1><nav class="modes" aria-label="分かっている関係"><button data-mode="proportion" aria-pressed="true">比例する</button><button data-mode="inverse" aria-pressed="false">反比例する</button></nav><section class="given-card"><p class="minor">はじめに分かっていること</p><div id="given" class="given math"></div></section><section class="formula-card"><p id="step-label" class="step-label"></p><div id="work" class="equation math" aria-live="polite"></div><p id="note" class="near"></p></section><section id="check-panel" class="panel" hidden><h2>別の x でも確かめる</h2><div class="control-head"><label for="check-range">x の値</label><output id="check-value" class="math"></output></div><div class="slider"><button id="check-minus" aria-label="確かめるxを小さくする">−</button><input id="check-range" type="range" min="0" max="10" value="6" step="1"><button id="check-plus" aria-label="確かめるxを大きくする">＋</button></div><div id="check-equation" class="check-equation math"></div><p id="check-note" class="minor"></p></section><section class="panel graph-panel"><div id="coordinate" class="coordinate math"></div><div id="graph"></div><p id="graph-note" class="near"></p></section><details class="panel" id="conditions"><summary>元の x・y を変えて試す</summary><div class="presets"><button data-preset="0">正の値</button><button data-preset="1">負の x</button><button data-preset="2">負の y</button><button data-preset="3">両方負</button></div><div class="control-head"><label for="x-range">元の x</label><output id="x-value" class="math"></output></div><div class="slider"><button id="x-minus" aria-label="元のxを小さくする">−</button><input id="x-range" type="range" min="0" max="11" step="1" value="9"><button id="x-plus" aria-label="元のxを大きくする">＋</button></div><div class="control-head"><label for="y-range">元の y</label><output id="y-value" class="math"></output></div><div class="slider"><button id="y-minus" aria-label="元のyを小さくする">−</button><input id="y-range" type="range" min="0" max="23" step="1" value="17"><button id="y-plus" aria-label="元のyを大きくする">＋</button></div><p class="minor">ここでは x・y が0でない1組を使います。値を変えると最初の段階に戻ります。</p></details><div class="reset-row"><button id="reset" class="quiet">この条件ではじめから</button></div><div class="dock steps"><button id="prev">‹ 戻る</button><span id="count" class="minor"></span><button id="next">次へ ›</button></div></main><script src="app.js?rev=20261016arrows"></script><script src="../screen-fit.js?rev=20261016arrows"></script><script src="../../shared/material-numbers.js?rev=20261013numbers"></script></body></html>
