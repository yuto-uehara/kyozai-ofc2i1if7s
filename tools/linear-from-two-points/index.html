<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>一次関数｜2点から式を決める</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../screen-fit.css"></head><body><main><a class="back" href="../../index.html">‹ 教材一覧</a><p class="eyebrow">中2 · 一次関数</p><h1>この2点を通る式を、<br>求めよう。</h1><div class="presets"><button data-preset="0">上がる</button><button data-preset="1">下がる</button><button data-preset="2">水平</button><button data-preset="3">同じ x</button></div><section class="given-card"><p class="minor">元の2点 · P から Q へ</p><div id="given" class="given math"></div><button id="swap" class="swap">P と Q を入れ替える</button></section><section class="formula-card"><div id="formula" class="small-formula math"></div><p id="step-label" class="step-label"></p><div id="work" class="equation math" aria-live="polite"></div><p id="note" class="near"></p></section><section class="panel graph-panel"><div id="graph"></div><div class="legend"><span>○ 元の点 P</span><span class="orange">● 先の点 Q</span></div><p id="graph-note" class="near"></p></section><section id="point-choice" class="panel" hidden><h2>b を求めるのに使う点</h2><div class="modes"><button data-point="P" aria-pressed="true">P を使う</button><button data-point="Q" aria-pressed="false">Q を使う</button></div><p class="minor">どちらの点を使っても、b は同じ。</p></section><section id="check" class="panel" hidden></section><details class="panel"><summary>元の2点を変えて試す</summary><div id="sliders"></div><p class="minor">数を変えると、元の条件からやり直します。</p></details><div class="reset-row"><button id="reset" class="quiet">この2点ではじめから</button></div><div class="dock steps"><button id="prev">‹ 戻る</button><span id="count" class="minor"></span><button id="next">次へ ›</button></div></main><script src="app.js"></script><script src="../screen-fit.js"></script></body></html>
