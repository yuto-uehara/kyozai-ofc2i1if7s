<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基準との差で平均を求める</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n1s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>基準との差で平均を求める</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">小さい差で計算して、基準に戻す</h2><p id="given" class="lesson-given"></p><div class="lesson-visual"><div id="difference-bars"></div><p class="lesson-note">横線は基準。上は正、下は負の差です。</p></div><div class="lesson-settings"><label for="sample">データ</label><select id="sample"><option value="0">身長</option><option value="1">得点</option><option value="2">気温</option></select></div><div class="lesson-controls"><label for="baseline">基準 <output id="baseline-value"></output></label><input id="baseline" type="range" min="140" max="165" value="150"></div><p id="difference-calculation" class="lesson-secondary math"></p><div id="mean-result" class="lesson-result" aria-live="polite"></div><p id="direct" class="lesson-state"></p></div></section><section class="panel"><h2>基準を変えても、平均は同じ</h2><p class="near">それぞれの値 ＝ 基準 ＋ 基準との差</p><p class="near">4人分を合計すると、基準が4個分あります。<br>合計を4でわると「基準1個分 ＋ 差の平均」。</p><p class="near">差の平均だけを答えにせず、最後に基準を足します。差の平均が負なら、基準より小さい平均です。</p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js?rev=20261016fourquiz"></script><script src="../screen-fit.js?rev=20261017steps"></script><script src="../../shared/material-numbers.js?rev=20261016c"></script></body></html>
