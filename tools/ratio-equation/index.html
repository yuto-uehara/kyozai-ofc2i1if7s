<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>比例式と2つの積</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n3s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>比例式と2つの積</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">同じ比なら、外側と内側の積が等しい</h2><p id="given" class="lesson-given"></p><div class="lesson-visual"><div id="ratio-bars"></div><p class="lesson-note">上の組と下の組の比を比べます。<br>橙と黒の長さは同じ目盛りです。</p></div><div class="lesson-settings"><label for="pair">もとの比</label><select id="pair"><option value="0">2：3</option><option value="1">3：5</option><option value="2">4：7</option></select><button id="match">同じ比にそろえる</button></div><div class="lesson-controls"><label for="scale">左の数の倍率 <output id="scale-value"></output></label><input id="scale" type="range" min="1" max="4" step="1" value="2"><label for="x">右の数 x <output id="current-x"></output></label><input id="x" type="range" min="1" max="30" step="1" value="6"></div><p id="ratio" class="lesson-result"></p><p id="products" class="lesson-state math" aria-live="polite"></p><p id="judgment" class="lesson-state" role="status"></p></div></section><section class="panel"><h2>未知の数を求める</h2><p id="unknown" class="near math"></p><p id="solution" class="near math"></p><p class="near">a：b ＝ c：d なら、a × d ＝ b × c。<br>比の値 a/b と c/d が等しいことから、両辺に b × d をかけて確かめられます（b、d は0でない）。</p><p class="minor">この教材では、正の整数で比を比べます。</p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js?rev=20261016arrows"></script><script src="../screen-fit.js?rev=20261016arrows"></script><script src="../../shared/material-numbers.js?rev=20261016c"></script></body></html>
