<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指定直線上の等距離点</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n5s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>指定直線上の等距離点</h1><section class="panel" data-fit-step-range="#step" data-fit-step-label><div class="lesson-unit"><h2 id="stage-title">指定直線と2点を確かめる</h2><p class="circle-given">直線ℓ上にあり、A・Bからの距離が等しい点Pを作図しよう。</p><div class="visual"><svg id="diagram" viewBox="0 -25 500 365" role="img" aria-label="指定直線と垂直二等分線の交点"></svg><p class="minor">独自の図。AとBは異なる2点で、位置は固定しています。</p></div><div class="settings"><label for="line-case">指定直線ℓ</label><select id="line-case"><option value="up">右上がり</option><option value="down">右下がり</option><option value="flat">横向き</option><option value="parallel">垂直二等分線と平行</option><option value="same">垂直二等分線と一致</option></select><label for="offset">位置 <output id="offset-out">2</output></label><input id="offset" type="range" min="1" max="3" step="0.5" value="2"></div><p id="reason" role="status"></p><p id="check" class="math"></p><div class="fit-native-steps"><input id="step" type="range" min="0" max="3" value="0"></div></div></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js"></script><script src="../screen-fit.js?rev=20261017steplabel"></script><script src="../../shared/material-numbers.js?rev=20261017lineequal"></script></body></html>
