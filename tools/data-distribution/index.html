<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>データを表と分布で見る</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n7s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>データを表と分布で見る</h1><section class="panel"><h2>通学時間を階級にまとめよう</h2><p class="near">同じデータを、階級に分けた表とグラフで表そう。</p><label for="raw-group">元データ</label><select id="raw-group" data-group><option value="0">A組 12人</option><option value="1">B組 24人</option></select><p id="raw-data" class="near math"></p><p class="minor">単位は分。学習用に作ったデータです。</p></section><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">階級と棒を対応させる</h2><p id="hist-given" class="lesson-given"></p><div class="lesson-visual"><div id="histogram"></div><p class="lesson-note">棒は度数、線は階級の中央を結ぶ度数折れ線。</p></div><div class="lesson-settings"><label for="group">組</label><select id="group" data-group><option value="0">A組</option><option value="1">B組</option></select><label for="width">階級幅</label><select id="width" data-width><option value="5">5分</option><option value="10">10分</option></select></div><div class="lesson-controls"><label for="bin">確かめる階級</label><select id="bin"></select></div><p id="selected-count" class="lesson-result"></p><p id="selected-relative" class="lesson-state math"></p><p id="selected-cumulative" class="lesson-state"></p></div></section><section class="panel"><h2>度数分布表でまとめる</h2><p id="table-caption" class="near"></p><table><thead><tr><th>階級（分）</th><th>度数</th><th>相対度数</th><th>累積度数</th></tr></thead><tbody id="distribution-table"></tbody></table><p class="minor">以上をふくみ、未満をふくみません。相対度数は小数第3位まで表示。丸めた数の合計は1とずれることがあります。</p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js?rev=20261017distributionsplit"></script><script src="../screen-fit.js?rev=20261017steps"></script><script src="../../shared/material-numbers.js?rev=20261017distributionsplit"></script></body></html>
