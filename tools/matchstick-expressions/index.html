<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>図の数え方を文字式へ</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="style.css?rev=20261016arrows"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n2s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>図の数え方を文字式へ</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">正方形が何個でも使える式をつくる</h2><p class="lesson-given">同じ長さの棒で正方形を横1列に並べます。隣り合う辺は1本の棒を共有します。必要な棒の本数を数えよう。</p><div class="lesson-visual"><div id="sticks"></div><p id="diagram-note" class="lesson-note"></p></div><div class="lesson-settings"><label for="method">数え方</label><select id="method"><option value="rows">横と縦に分ける</option><option value="add">はじめの1個と残り</option><option value="shared">重なりを引く</option></select></div><div class="lesson-controls"><label for="n">正方形の個数 n <output id="n-value"></output></label><input id="n" type="range" min="1" max="8" step="1" value="4"></div><p id="concrete" class="lesson-state math"></p><p id="general" class="lesson-result math" aria-live="polite"></p><p id="interpretation" class="lesson-state"></p></div></section><section class="panel"><h2>違う数え方でも同じ本数</h2><p class="near math">2n ＋ (n ＋ 1) ＝ 3n ＋ 1</p><p class="near math">4 ＋ 3(n − 1) ＝ 3n ＋ 1</p><p class="near math">4n − (n − 1) ＝ 3n ＋ 1</p><p class="near">3n は3×nのこと。nは正方形の個数で、1以上の整数です。数え方の違いを図で確かめてから、文字式をまとめましょう。</p></section><section class="panel" id="notation-panel"><div class="lesson-unit"><h2 class="lesson-title">積・商・累乗を文字式で書く</h2><p class="lesson-given">書き方を変えても、表す量は同じ。aの値を変えて確かめよう。ここではb＝2です。</p><div class="lesson-visual"><div id="notation-original" class="notation-equation"></div><div id="notation-short" class="notation-equation"></div><p id="notation-rule" class="lesson-note"></p></div><div class="lesson-settings"><label for="notation-case">書き方</label><select id="notation-case"><option value="0">数と文字の積</option><option value="1">文字どうしの積</option><option value="2">係数1</option><option value="3">係数−1</option><option value="4">同じ文字の積</option><option value="5">数で割る</option><option value="6">和を割る</option><option value="7">文字で割る</option></select></div><div class="lesson-controls"><label for="notation-a">代入するa <output id="notation-a-out"></output></label><input id="notation-a" type="range" min="-3" max="3" value="2"></div><p id="notation-value" class="lesson-state math"></p><p id="notation-note" class="lesson-state" role="status"></p></div></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js?rev=20261016fourquiz"></script><script src="notation.js"></script><script src="../screen-fit.js?rev=20261016arrows"></script><script src="../../shared/material-numbers.js?rev=20261016e"></script></body></html>
