<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>図の数え方を文字式へ</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n2s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>図の数え方を文字式へ</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">正方形が何個でも使える式をつくる</h2><p class="lesson-given">同じ長さの棒で正方形を横1列に並べます。隣り合う辺は1本の棒を共有します。必要な棒の本数を数えよう。</p><div class="lesson-visual"><div id="sticks"></div><p id="diagram-note" class="lesson-note"></p></div><div class="lesson-settings"><label for="method">数え方</label><select id="method"><option value="rows">横と縦に分ける</option><option value="add">はじめの1個と残り</option><option value="shared">重なりを引く</option></select></div><div class="lesson-controls"><label for="n">正方形の個数 n <output id="n-value"></output></label><input id="n" type="range" min="1" max="8" step="1" value="4"></div><p id="concrete" class="lesson-state math"></p><p id="general" class="lesson-result math" aria-live="polite"></p><p id="interpretation" class="lesson-state"></p></div></section><section class="panel"><h2>違う数え方でも同じ本数</h2><p class="near math">2n ＋ (n ＋ 1) ＝ 3n ＋ 1</p><p class="near math">4 ＋ 3(n − 1) ＝ 3n ＋ 1</p><p class="near math">4n − (n − 1) ＝ 3n ＋ 1</p><p class="near">3n は3×nのこと。nは正方形の個数で、1以上の整数です。数え方の違いを図で確かめてから、文字式をまとめましょう。</p></section><section class="panel"><h2>確かめよう</h2><p class="near">正方形を10個並べたら棒は何本？</p><div class="choices"><button data-answer="right">31本</button><button data-answer="wrong">40本</button></div><p id="feedback" class="near" role="status"></p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js"></script><script src="../screen-fit.js"></script><script src="../../shared/material-numbers.js?rev=20261016e"></script></body></html>
