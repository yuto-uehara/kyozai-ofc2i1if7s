<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素数・素因数分解｜並べ方と分解図</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../screen-fit.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n0s">‹ 教材一覧</a><p class="eyebrow">中1 · 算数から数学へ</p><h1>素数と素因数分解</h1><section class="given-card panel"><h2>調べる数を選ぶ</h2><p id="original" class="given coordinate math"></p><label for="number">1〜100の整数</label><input id="number" type="range" min="1" max="100" value="36"><div class="presets"><button data-number="1">1</button><button data-number="12">12</button><button data-number="36">36</button><button data-number="60">60</button><button data-number="97">97</button></div></section><section class="panel"><div class="prime-interactive"><h2>長方形に並べると、約数が見える</h2><label for="pair">たて × よこの並べ方</label><select id="pair"></select><div id="array"></div><p id="divisors" class="near" aria-live="polite"></p><p id="prime" class="near"></p></div></section><section class="panel"><div class="prime-interactive"><h2>素数になるまで分ける</h2><div id="tree"></div><p id="product" class="near math" aria-live="polite"></p><p class="minor">枝の先をかけると、もとの数になります。色のついた丸は素数です。</p><div class="modes"><button id="less">1つ戻す</button><button id="split">次を分ける</button></div></div></section><section class="panel"><h2>同じ素因数を指数でまとめる</h2><div id="powers" class="equation math"></div><p id="expanded" class="near math"></p><p id="power-note" class="near"></p><p class="near">指数は「同じ数を何回かけるか」を表します。<br>例：2³ = 2 × 2 × 2 = 8。<br>2 × 3 = 6 とは違います。</p></section><section class="panel"><h2>確かめよう</h2><p class="near">1が素数ではないのは、なぜ？</p><div class="choices"><button data-answer="right">正の約数が1個だけだから</button><button data-answer="wrong">奇数だから</button></div><p id="feedback" class="near" role="status"></p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js"></script><script src="../screen-fit.js"></script><script src="../../shared/material-numbers.js?rev=20261016b"></script></body></html>
