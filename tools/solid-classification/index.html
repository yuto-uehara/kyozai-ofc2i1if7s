<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立体の分類</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n6s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>立体の分類</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">底面・側面・頂点に注目する</h2><p id="given" class="lesson-given"></p><div class="lesson-visual"><div id="solid-diagram"></div><p id="visual-note" class="lesson-note"></p></div><div class="lesson-settings"><label for="shape">立体</label><select id="shape"><option value="prism">正四角柱</option><option value="pyramid">正四角錐</option><option value="cylinder">円柱</option><option value="cone">円錐</option><option value="sphere">球</option></select></div><div class="lesson-controls"><label for="size"><span id="size-label">底面の1辺 a</span><output id="size-out"></output></label><input id="size" type="range" min="1" max="5" step="1" value="3"><label for="height" id="height-label">高さ h <output id="height-out"></output></label><input id="height" type="range" min="1" max="8" step="1" value="4"></div><p id="solid-classification" class="lesson-state" aria-live="polite"></p></div></section><section class="panel"><h2>柱・錐・球を見分ける</h2><p class="near">柱：合同で平行な底面が2枚。底面が多角形なら角柱、円なら円柱。</p><p class="near">錐：底面が1枚で、側面が1つの頂点へ集まる。底面が多角形なら角錐、円なら円錐。</p><p class="near">球：表面が、中心から同じ距離rにある立体。</p><p class="near">平面だけで囲まれた立体が多面体。正四角柱・正四角錐は多面体ですが、円柱・円錐・球には曲面があります。</p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js?rev=20261017split2"></script><script src="../screen-fit.js?rev=20261017steps"></script><script src="../../shared/material-numbers.js?rev=20261017split2"></script></body></html>
