<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>負号とかっこの累乗</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n1s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>負号とかっこの累乗</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">指数は、どこにかかる？</h2><p class="lesson-given">同じaとnで、−aⁿと(−a)ⁿを比べよう。aは正の整数、nは正の整数です。</p><div class="lesson-visual"><div id="comparison"></div></div><div class="lesson-controls"><label for="base">a <output id="base-out"></output></label><input id="base" type="range" min="1" max="5" value="3"><label for="exponent">n <output id="exponent-out"></output></label><input id="exponent" type="range" min="1" max="4" value="2"></div><p id="reason" class="lesson-state" role="status"></p><p class="lesson-state">累乗は「同じ数をn個かけること」。a × nとは違います。</p></div></section><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">累乗 → 乗除 → 加減の順に</h2><p class="lesson-given">負号を含むかっこに注意して、元の式から1段ずつ確かめよう。</p><div class="lesson-visual"><div id="original" class="equation"></div><div id="working" class="equation"></div></div><div class="lesson-settings"><label for="mode">負号の位置</label><select id="mode"><option value="outside">−3² ＋ 2 × 4</option><option value="inside">(−3)² ＋ 2 × 4</option></select></div><div class="lesson-controls"><label for="step">計算段階 <output id="step-out"></output></label><input id="step" type="range" min="0" max="3" value="0"></div><p id="step-reason" class="lesson-state" role="status"></p><p class="lesson-state">累乗と乗算を先に計算します。足し算を先にまとめないようにしよう。</p></div></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js?rev=20261016arrows"></script><script src="../screen-fit.js?rev=20261016arrows"></script><script src="../../shared/material-numbers.js?rev=20261016h"></script></body></html>
