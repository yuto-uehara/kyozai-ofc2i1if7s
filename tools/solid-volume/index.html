<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柱・錐・球の体積</title><link rel="stylesheet" href="../linear-from-two-points/style.css"><link rel="stylesheet" href="../screen-fit.css?rev=20261016arrows"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/material-numbers.css"></head><body><main><a class="back" href="../../index.html#c1n6s">‹ 教材一覧</a><p class="eyebrow">中1</p><h1>柱・錐・球の体積</h1><section class="panel"><div class="lesson-unit"><h2 class="lesson-title">底面積と高さから体積を考える</h2><p id="given" class="lesson-given"></p><div class="lesson-visual"><div id="solid-diagram"></div><p id="visual-note" class="lesson-note"></p></div><div class="lesson-settings"><label for="shape">立体</label><select id="shape"><option value="prism">正四角柱</option><option value="pyramid">正四角錐</option><option value="cylinder">円柱</option><option value="cone">円錐</option><option value="sphere">球</option></select></div><div class="lesson-controls"><label for="size"><span id="size-label">底面の1辺 a</span><output id="size-out"></output></label><input id="size" type="range" min="1" max="5" step="1" value="3"><label for="height" id="height-label">高さ h <output id="height-out"></output></label><input id="height" type="range" min="1" max="8" step="1" value="4"></div><p id="base-area" class="lesson-state math"></p><div id="volume-formula" class="lesson-state math"></div><div id="volume-result" class="lesson-result math" aria-live="polite"></div></div></section><section class="panel"><h2>同じ底面積・高さの柱を基準に</h2><p class="near">柱：底面の形を変えずに高さの分だけ積み重ねるので、体積は底面積 × 高さ。</p><p class="near">錐：同じ底面積・高さの柱の体積の3分の1。高さは底面に垂直な長さです。母線や斜めの辺の長さではありません。</p><p class="near">球：半径r、高さ2rの円柱の体積の3分の2。円柱の2πr³に2/3をかけると、球の体積4πr³/3になります。</p><p class="minor">体積の単位はcm³。底面積のcm²とは区別します。図は見取り図です。</p></section><div class="reset-row"><button id="reset">はじめから</button></div></main><script src="app.js?rev=20261017split2"></script><script src="../screen-fit.js?rev=20261017steps"></script><script src="../../shared/material-numbers.js?rev=20261017split2"></script></body></html>
