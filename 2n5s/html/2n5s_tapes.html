<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>テープの重なり</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;-webkit-touch-callout:none}
svg{display:block;width:100vw;height:100vh;touch-action:none}
text{font-weight:700}
.var{font-family:"Times New Roman","Noto Serif","Georgia",serif;font-style:italic;font-weight:400}
.btn{cursor:pointer}.btn rect{fill:#fff;stroke:#191919;stroke-width:3}
.btn text{fill:#191919;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.btn.on rect{fill:#191919}.btn.on text{fill:#fff}.btn.off{opacity:.3}
</style>
</head>
<body>
<svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
const COL={black:"#191919",red:"#d62728",blue:"#1f5fbf",green:"#1e8c46",orange:"#e65c00",gray:"#9a9a9a",
  lred:"#f7c8c8",lblue:"#bed4f5",lgreen:"#bee6c8",grid:"#e1e1e1"};
function el(tag,a,p){const e=document.createElementNS(NS,tag);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
// text with {italic} markup
function T(g,x,y,s,size,color,anchor){
  const t=el('text',{x,y,'font-size':size,fill:color||COL.black,'text-anchor':anchor||'middle','dominant-baseline':'central'},g);
  String(s).split(/(\{[^}]*\})/).forEach(p=>{if(!p)return;
    if(p[0]==='{'){const sp=el('tspan',{class:'var','font-size':size*1.15},t);sp.textContent=p.slice(1,-1);}
    else{const sp=el('tspan',{},t);sp.textContent=p.replace(/ /g,'\u00a0');}});
  return t;
}
function W(t){try{return t.getComputedTextLength();}catch(e){return 0;}}
// stacked fraction; x = left edge; returns width
function FR(g,x,y,num,den,size,color){
  const a=T(g,0,y-size*0.62,num,size,color),b=T(g,0,y+size*0.66,den,size,color);
  const w=Math.max(W(a),W(b))+size*0.35;
  a.setAttribute('x',x+w/2);b.setAttribute('x',x+w/2);
  el('line',{x1:x,y1:y,x2:x+w,y2:y,stroke:color||COL.black,'stroke-width':Math.max(3,size/14)},g);
  return w;
}
// parts: [str,color] or ['FRAC',num,den,color]; returns end x
function RICH(g,x,y,parts,size,anchor){
  const grp=el('g',{},g);let cx=0;
  parts.forEach(p=>{
    if(p[0]==='FRAC'){cx+=4;cx+=FR(grp,cx,y,p[1],p[2],size*0.8,p[3])+6;}
    else{const t=T(grp,cx,y,p[0],size,p[1],'start');cx+=W(t);}
  });
  let off=x; if(anchor==='middle')off=x-cx/2; else if(anchor==='end')off=x-cx;
  grp.setAttribute('transform',`translate(${off},0)`);
  return off+cx;
}
// fractions
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function minus(s){return String(s).replace(/-/g,'−');}
// value as parts: integer or fraction num/den (den>0)
function fracParts(n,d,color,paren){
  const g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d;}
  if(d===1){const s=minus(n);return [[paren&&n<0?'('+s+')':s,color]];}
  const neg=n<0;const body=[['FRAC',String(Math.abs(n)),String(d),color]];
  if(!neg)return body;
  return paren?[['(−',color],...body,[')',color]]:[['−',color],...body];
}
function fmt(v){ if(Math.abs(v-Math.round(v))<1e-9)return minus(Math.round(v)); return minus(+v.toFixed(2)); }
// buttons
function BTN(p,x,y,w,h,label,opt,fn){
  opt=opt||{};const g=el('g',{class:'btn'+(opt.on?' on':'')+(opt.off?' off':''),transform:`translate(${x},${y})`},p);
  el('rect',{x:0,y:0,width:w,height:h,rx:16},g);
  const t=T(g,w/2,h/2,label,opt.fs||34,null);t.removeAttribute('fill');
  g.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!opt.off)fn();});
  return g;
}
// global drag handling: register draggable with onDown -> returns handler(pt) or null
let DRAG=null;
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
const HITS=[]; // functions(pt) -> move handler or null (checked in order)
svg.addEventListener('pointerdown',e=>{const p=svgPt(e);
  for(const h of HITS){const m=h(p);if(m){DRAG=m;svg.setPointerCapture(e.pointerId);e.preventDefault();m(p);return;}}});
svg.addEventListener('pointermove',e=>{if(!DRAG)return;e.preventDefault();DRAG(svgPt(e));});
svg.addEventListener('pointerup',()=>{DRAG=null;});svg.addEventListener('pointercancel',()=>{DRAG=null;});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
// slider drawing: n steps, idx; geometry stored for hit test
function SLIDER(p,x,y,len,n,idx,label){
  el('line',{x1:x,y1:y,x2:x+len,y2:y,stroke:COL.gray,'stroke-width':8,'stroke-linecap':'round'},p);
  const kx=x+len*idx/(n-1);
  el('line',{x1:x,y1:y,x2:kx,y2:y,stroke:COL.black,'stroke-width':8,'stroke-linecap':'round'},p);
  el('circle',{cx:kx,cy:y,r:26,fill:'#fff',stroke:COL.black,'stroke-width':5},p);
  return {x,y,len,n};
}
function sliderHit(geo,setIdx){return p=>{ if(!geo)return null;
  if(p.x<geo.x-40||p.x>geo.x+geo.len+40||Math.abs(p.y-geo.y)>45)return null;
  return q=>{let i=Math.round((q.x-geo.x)/geo.len*(geo.n-1));i=Math.max(0,Math.min(geo.n-1,i));setIdx(i);};};}
function isLand(){return innerWidth>=innerHeight;}


// coordinate plane: cfg {cx,cy,u,xmin,xmax,ymin,ymax,step,fs}
function PLANE(g,c){
  const X=x=>c.cx+x*c.u, Y=y=>c.cy-y*c.u;
  for(let x=c.xmin;x<=c.xmax;x++) el('line',{x1:X(x),y1:Y(c.ymin),x2:X(x),y2:Y(c.ymax),stroke:COL.grid,'stroke-width':2},g);
  for(let y=c.ymin;y<=c.ymax;y++) el('line',{x1:X(c.xmin),y1:Y(y),x2:X(c.xmax),y2:Y(y),stroke:COL.grid,'stroke-width':2},g);
  const ext=c.u*0.6;
  el('line',{x1:X(c.xmin)-8,y1:Y(0),x2:X(c.xmax)+ext,y2:Y(0),stroke:COL.black,'stroke-width':4},g);
  el('line',{x1:X(0),y1:Y(c.ymin)+8,x2:X(0),y2:Y(c.ymax)-ext,stroke:COL.black,'stroke-width':4},g);
  el('polygon',{points:`${X(c.xmax)+ext+16},${Y(0)} ${X(c.xmax)+ext-2},${Y(0)-9} ${X(c.xmax)+ext-2},${Y(0)+9}`,fill:COL.black},g);
  el('polygon',{points:`${X(0)},${Y(c.ymax)-ext-16} ${X(0)-9},${Y(c.ymax)-ext+2} ${X(0)+9},${Y(c.ymax)-ext+2}`,fill:COL.black},g);
  const fs=c.fs||24, st=c.step||2;
  for(let x=Math.ceil(c.xmin/st)*st;x<=c.xmax;x+=st){ if(!x)continue; T(g,X(x),Y(0)+fs*0.95,minus(x),fs,COL.black); }
  for(let y=Math.ceil(c.ymin/st)*st;y<=c.ymax;y+=st){ if(!y)continue; T(g,X(0)-10,Y(y),minus(y),fs,COL.black,'end'); }
  T(g,X(0)-fs*0.6,Y(0)+fs*0.9,'O',fs,COL.black);
  T(g,X(c.xmax)+ext+10,Y(0)+fs*1.2,'{x}',fs*1.4,COL.black);
  T(g,X(0)-fs*1.0,Y(c.ymax)-ext,'{y}',fs*1.4,COL.black);
  return {X,Y};
}
// exact rational helpers: {n,d}
function R(n,d){d=d||1;const g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d;}return {n,d};}
function Rmul(a,b){return R(a.n*b.n,a.d*b.d);} function Radd(a,b){return R(a.n*b.d+b.n*a.d,a.d*b.d);}
function Rsub(a,b){return R(a.n*b.d-b.n*a.d,a.d*b.d);} function Rdiv(a,b){return R(a.n*b.d,a.d*b.n);}
function Rv(a){return a.n/a.d;}
function terminating(d){while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1;}
// parts for a rational: decimals allowed if terminating(opt.dec)
function Rparts(r,color,opt){opt=opt||{};
  if(r.d===1){const s=minus(r.n);return [[opt.paren&&r.n<0?'('+s+')':s,color]];}
  if(opt.dec&&terminating(r.d)){const s=minus(+(r.n/r.d).toFixed(4));return [[opt.paren&&r.n<0?'('+s+')':s,color]];}
  return fracParts(r.n,r.d,color,opt.paren);
}
// coefficient parts for "a x" : 1 -> '', -1 -> '−'
function coefParts(r,color){ if(r.n===r.d)return []; if(r.n===-r.d)return [['−',color]]; return Rparts(r,color); }


const root=el('g',{},svg);
let st,L,sg=null;
const ANG=[];for(let a=30;a<=150;a+=5)ANG.push(a);
function init(){st={ai:ANG.indexOf(60),same:false,diag:false};}
function layout(){
  if(isLand()){svg.setAttribute('viewBox','0 0 1600 900');
    L={c:[500,450],w1:270,clip:[20,20,960,860],sl:[1060,160,460],btn:[[1050,260,220,96],[1300,260,220,96]],name:[1290,520],deg:[1290,70],reset:[1400,790,170,90]};
  } else {svg.setAttribute('viewBox','0 0 1000 1500');
    L={c:[500,480],w1:280,clip:[20,20,960,900],sl:[200,1000,600],btn:[[150,1090,320,96],[530,1090,320,96]],name:[500,1290],deg:[500,960],reset:[790,1395,190,90]};
  }
  draw();
}
function draw(){
  root.innerHTML='';const g=root;const th=ANG[st.ai]*Math.PI/180,[cx,cy]=L.c,w1=L.w1,w2=st.same?w1:w1*1.45;
  const cp=el('clipPath',{id:'cp'},g);el('rect',{x:L.clip[0],y:L.clip[1],width:L.clip[2],height:L.clip[3]},cp);
  const fg=el('g',{'clip-path':'url(#cp)'},g);
  const u2=[Math.cos(th),-Math.sin(th)],n2=[Math.sin(th),Math.cos(th)];
  // strip 1 horizontal
  el('rect',{x:cx-2000,y:cy-w1/2,width:4000,height:w1,fill:'#e8f0fc',stroke:COL.blue,'stroke-width':4},fg);
  // strip 2
  const Lg=2000,p=(s,t)=>[cx+u2[0]*s+n2[0]*t,cy+u2[1]*s+n2[1]*t];
  const s2=[p(-Lg,-w2/2),p(Lg,-w2/2),p(Lg,w2/2),p(-Lg,w2/2)];
  el('polygon',{points:s2.map(q=>q.join(',')).join(' '),fill:'#fdeedd','fill-opacity':0.85,stroke:COL.orange,'stroke-width':4},fg);
  // overlap parallelogram
  const sn=Math.sin(th),a=(w2/2)/sn,b=(w1/2)/sn;
  const V=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([s,t])=>[cx+s*a+t*b*u2[0],cy+t*b*u2[1]]);
  // order around
  const Q=[V[0],V[1],V[2],V[3]];
  el('polygon',{points:Q.map(q=>q.join(',')).join(' '),fill:COL.lblue,stroke:COL.black,'stroke-width':6,'stroke-linejoin':'round'},fg);
  const sq=st.same, rt=ANG[st.ai]===90;
  // marks: equal sides
  const tick=(P1,P2,k)=>{const mx=(P1[0]+P2[0])/2,my=(P1[1]+P2[1])/2,l=Math.hypot(P2[0]-P1[0],P2[1]-P1[1]),ux=(P2[0]-P1[0])/l,uy=(P2[1]-P1[1])/l;
    for(let i=0;i<k;i++){const o=(i-(k-1)/2)*10;el('line',{x1:mx+ux*o-uy*13,y1:my+uy*o+ux*13,x2:mx+ux*o+uy*13,y2:my+uy*o-ux*13,stroke:COL.red,'stroke-width':4},fg);}};
  tick(Q[0],Q[1],1);tick(Q[2],Q[3],1);tick(Q[1],Q[2],sq?1:2);tick(Q[3],Q[0],sq?1:2);
  if(rt)Q.forEach((q,i)=>{const pn=Q[(i+1)%4],pv=Q[(i+3)%4],s=24;const ua=[(pn[0]-q[0]),(pn[1]-q[1])],ub=[(pv[0]-q[0]),(pv[1]-q[1])];
    const la=Math.hypot(...ua),lb=Math.hypot(...ub);const A1=[q[0]+ua[0]/la*s,q[1]+ua[1]/la*s],B1=[q[0]+ub[0]/lb*s,q[1]+ub[1]/lb*s],C1=[A1[0]+ub[0]/lb*s,A1[1]+ub[1]/lb*s];
    el('polyline',{points:[A1,C1,B1].map(z=>z.join(',')).join(' '),fill:'none',stroke:COL.green,'stroke-width':4},fg);});
  if(st.diag){el('line',{x1:Q[0][0],y1:Q[0][1],x2:Q[2][0],y2:Q[2][1],stroke:COL.green,'stroke-width':4},fg);
    el('line',{x1:Q[1][0],y1:Q[1][1],x2:Q[3][0],y2:Q[3][1],stroke:COL.green,'stroke-width':4},fg);
    if(sq){const s=20,d1=[Q[2][0]-Q[0][0],Q[2][1]-Q[0][1]],d2=[Q[1][0]-Q[3][0],Q[1][1]-Q[3][1]];const l1=Math.hypot(...d1),l2=Math.hypot(...d2);
      const A1=[cx+d1[0]/l1*s,cy+d1[1]/l1*s],B1=[cx+d2[0]/l2*s,cy+d2[1]/l2*s],C1=[A1[0]+d2[0]/l2*s,A1[1]+d2[1]/l2*s];
      el('polyline',{points:[A1,C1,B1].map(z=>z.join(',')).join(' '),fill:'none',stroke:COL.green,'stroke-width':4},fg);}
    if(rt){[[Q[0],[cx,cy]],[[cx,cy],Q[2]],[Q[1],[cx,cy]],[[cx,cy],Q[3]]].forEach(([p1,p2])=>{const mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;el('circle',{cx:mx,cy:my,r:7,fill:'none',stroke:COL.green,'stroke-width':4},fg);});}
  }
  el('rect',{x:L.clip[0],y:L.clip[1],width:L.clip[2],height:L.clip[3],fill:'none',stroke:COL.gray,'stroke-width':2},g);
  // panel
  sg=SLIDER(g,...L.sl,ANG.length,st.ai);
  T(g,L.deg[0],L.deg[1],ANG[st.ai]+'°',56,COL.black);
  BTN(g,...L.btn[0],'同じ幅',{on:st.same,fs:34},()=>{st.same=!st.same;draw();});
  BTN(g,...L.btn[1],'対角線',{on:st.diag,fs:34},()=>{st.diag=!st.diag;draw();});
  const nm=sq&&rt?'正方形':sq?'ひし形':rt?'長方形':'平行四辺形';
  T(g,L.name[0],L.name[1],nm,72,COL.blue);
  BTN(g,...L.reset,'リセット',{fs:32},()=>{init();draw();});
}
HITS.push(p=>sliderHit(sg,i=>{if(i!==st.ai){st.ai=i;draw();}})(p));
addEventListener('resize',layout);
init();layout();

</script>
</body>
</html>
