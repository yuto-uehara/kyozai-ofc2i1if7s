<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>回転体</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Meiryo",sans-serif}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#svg{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none}
#bar{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:2px solid #e4e4e4;background:#fff}
button{min-width:64px;min-height:56px;padding:0 18px;font-family:inherit;font-weight:700;font-size:24px;line-height:1;color:#191919;background:#fff;border:3px solid #191919;border-radius:12px;cursor:pointer;touch-action:manipulation}
button:active{background:#eee}
button.main{background:#191919;color:#fff}
button.main:active{background:#444}
button.on{background:#191919;color:#fff}
button:disabled{opacity:.3;cursor:default}
.sep{flex:none;width:14px}
@media (max-width:560px){button{font-size:19px;padding:0 12px}}
text{font-weight:700}
.var{font-family:"Times New Roman","Noto Serif","Georgia",serif;font-style:italic;font-weight:400}
.row{cursor:pointer}.row rect{fill:#fff;stroke:#191919;stroke-width:3}
.row text{fill:#191919;dominant-baseline:central;pointer-events:none}
.row.on rect{fill:#191919}.row.on text{fill:#fff}
</style>
</head>
<body>
<div id="wrap">
<svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
<div id="bar"></div>
</div>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
const COL={black:"#191919",red:"#d0362b",blue:"#2f7dd1",green:"#2ea55a",orange:"#f08a24",gray:"#9a9a9a",
  lred:"#f6cdc9",lblue:"#c9dff5",lgreen:"#c4e9d0",lorange:"#fbdcbd",grid:"#e1e1e1",text2:"#666"};
// text color: figure color darkened (x0.7) for legibility
const TXT={[COL.blue]:"#215892",[COL.green]:"#20743f",[COL.orange]:"#a8611a"};
const tc=c=>TXT[c]||c||COL.black;
// size tokens (px on screen, see style_reference.md); portrait viewBox is 1000 wide on ~820px -> x1.22
const TK={label:30,main:36,big:96,small:24,corner:28};
function SZ(n){return (typeof n==='number'?n:TK[n])*(isLand()?1:1.22);}
function el(tag,a,p){const e=document.createElementNS(NS,tag);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
// text with {italic} markup
function T(g,x,y,s,size,color,anchor){
  const t=el('text',{x,y,'font-size':size,fill:tc(color),'text-anchor':anchor||'middle','dominant-baseline':'central'},g);
  String(s).split(/(\{[^}]*\})/).forEach(p=>{if(!p)return;
    if(p[0]==='{'){const sp=el('tspan',{class:'var','font-size':size*1.15},t);sp.textContent=p.slice(1,-1);}
    else{const sp=el('tspan',{},t);sp.textContent=p.replace(/ /g,'\u00a0');}});
  if(size>=80)t.style.fontWeight=800;
  return t;
}
function W(t){try{return t.getComputedTextLength();}catch(e){return 0;}}
// stacked fraction; x = left edge; returns width
function FR(g,x,y,num,den,size,color){
  const a=T(g,0,y-size*0.62,num,size,color),b=T(g,0,y+size*0.66,den,size,color);
  const w=Math.max(W(a),W(b))+size*0.35;
  a.setAttribute('x',x+w/2);b.setAttribute('x',x+w/2);
  el('line',{x1:x,y1:y,x2:x+w,y2:y,stroke:tc(color),'stroke-width':Math.max(3,size/14)},g);
  return w;
}
// parts: [str,color] or ['FRAC',num,den,color]; returns end x
function RICH(g,x,y,parts,size,anchor){
  const grp=el('g',{},g);let cx=0;
  parts.forEach(p=>{
    if(p[0]==='FRAC'){cx+=4;cx+=FR(grp,cx,y,p[1],p[2],size*0.8,p[3])+6;}
    else{const t=T(grp,cx,y,p[0],size,p[1],'start');cx+=W(t);}
  });
  let off=x; if(anchor==='middle')off=x-cx/2; else if(anchor==='end')off=x-cx;
  grp.setAttribute('transform',`translate(${off},0)`);
  return off+cx;
}
// fractions
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function minus(s){return String(s).replace(/-/g,'−');}
// value as parts: integer or fraction num/den (den>0)
function fracParts(n,d,color,paren){
  const g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d;}
  if(d===1){const s=minus(n);return [[paren&&n<0?'('+s+')':s,color]];}
  const neg=n<0;const body=[['FRAC',String(Math.abs(n)),String(d),color]];
  if(!neg)return body;
  return paren?[['(−',color],...body,[')',color]]:[['−',color],...body];
}
function fmt(v){ if(Math.abs(v-Math.round(v))<1e-9)return minus(Math.round(v)); return minus(+v.toFixed(2)); }
// toolbar (HTML buttons at the bottom, same style as the exterior-angle page)
// specs: [{t:label, on, main, off, sep:true(gap before), aria, fn}]
const BAR=document.getElementById('bar');let barKey='';
function TOOLBAR(specs){
  const key=specs.map(b=>(b.sep?'|':'')+b.t).join(',');
  if(key!==barKey){BAR.innerHTML='';barKey=key;
    specs.forEach(b=>{if(b.sep){const d=document.createElement('span');d.className='sep';BAR.appendChild(d);}
      const e=document.createElement('button');e.textContent=b.t;if(b.aria)e.setAttribute('aria-label',b.aria);BAR.appendChild(e);});}
  const bs=BAR.querySelectorAll('button');
  specs.forEach((b,i)=>{const e=bs[i];e.classList.toggle('on',!!b.on);e.classList.toggle('main',!!b.main);e.disabled=!!b.off;e.onclick=()=>b.fn();});
}
// global drag handling: register draggable with onDown -> returns handler(pt) or null
let DRAG=null;
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
const HITS=[]; // functions(pt) -> move handler or null (checked in order)
svg.addEventListener('pointerdown',e=>{const p=svgPt(e);
  for(const h of HITS){const m=h(p);if(m){DRAG=m;svg.setPointerCapture(e.pointerId);e.preventDefault();m(p);return;}}});
svg.addEventListener('pointermove',e=>{if(!DRAG)return;e.preventDefault();DRAG(svgPt(e));});
svg.addEventListener('pointerup',()=>{DRAG=null;});svg.addEventListener('pointercancel',()=>{DRAG=null;});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
// slider drawing: n steps, idx; geometry stored for hit test
function SLIDER(p,x,y,len,n,idx,label){
  el('line',{x1:x,y1:y,x2:x+len,y2:y,stroke:'#d6d6d6','stroke-width':8,'stroke-linecap':'round'},p);
  const kx=x+len*idx/(n-1);
  el('line',{x1:x,y1:y,x2:kx,y2:y,stroke:COL.black,'stroke-width':8,'stroke-linecap':'round'},p);
  el('circle',{cx:kx,cy:y,r:SZ(22),fill:COL.black},p);el('circle',{cx:kx,cy:y,r:SZ(8),fill:'#fff'},p);
  return {x,y,len,n};
}
function sliderHit(geo,setIdx){return p=>{ if(!geo)return null;
  if(p.x<geo.x-40||p.x>geo.x+geo.len+40||Math.abs(p.y-geo.y)>45)return null;
  return q=>{let i=Math.round((q.x-geo.x)/geo.len*(geo.n-1));i=Math.max(0,Math.min(geo.n-1,i));setIdx(i);};};}
// draggable point (same look as the exterior-angle page: filled dot + white center)
function DOT(p,x,y,c){el('circle',{cx:x,cy:y,r:SZ(12),fill:c||COL.black},p);el('circle',{cx:x,cy:y,r:SZ(4.5),fill:'#fff'},p);}
function isLand(){return innerWidth>=innerHeight;}


// coordinate plane: cfg {cx,cy,u,xmin,xmax,ymin,ymax,step,fs}
function PLANE(g,c){
  const X=x=>c.cx+x*c.u, Y=y=>c.cy-y*c.u;
  for(let x=c.xmin;x<=c.xmax;x++) el('line',{x1:X(x),y1:Y(c.ymin),x2:X(x),y2:Y(c.ymax),stroke:COL.grid,'stroke-width':2},g);
  for(let y=c.ymin;y<=c.ymax;y++) el('line',{x1:X(c.xmin),y1:Y(y),x2:X(c.xmax),y2:Y(y),stroke:COL.grid,'stroke-width':2},g);
  const ext=c.u*0.6;
  el('line',{x1:X(c.xmin)-8,y1:Y(0),x2:X(c.xmax)+ext,y2:Y(0),stroke:COL.black,'stroke-width':4},g);
  el('line',{x1:X(0),y1:Y(c.ymin)+8,x2:X(0),y2:Y(c.ymax)-ext,stroke:COL.black,'stroke-width':4},g);
  el('polygon',{points:`${X(c.xmax)+ext+16},${Y(0)} ${X(c.xmax)+ext-2},${Y(0)-9} ${X(c.xmax)+ext-2},${Y(0)+9}`,fill:COL.black},g);
  el('polygon',{points:`${X(0)},${Y(c.ymax)-ext-16} ${X(0)-9},${Y(c.ymax)-ext+2} ${X(0)+9},${Y(c.ymax)-ext+2}`,fill:COL.black},g);
  const fs=c.fs||24, st=c.step||2;
  for(let x=Math.ceil(c.xmin/st)*st;x<=c.xmax;x+=st){ if(!x)continue; T(g,X(x),Y(0)+fs*0.95,minus(x),fs,COL.black); }
  for(let y=Math.ceil(c.ymin/st)*st;y<=c.ymax;y+=st){ if(!y)continue; T(g,X(0)-10,Y(y),minus(y),fs,COL.black,'end'); }
  T(g,X(0)-fs*0.6,Y(0)+fs*0.9,'O',fs,COL.black);
  T(g,X(c.xmax)+ext+10,Y(0)+fs*1.2,'{x}',fs*1.4,COL.black);
  T(g,X(0)-fs*1.0,Y(c.ymax)-ext,'{y}',fs*1.4,COL.black);
  return {X,Y};
}
// exact rational helpers: {n,d}
function R(n,d){d=d||1;const g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d;}return {n,d};}
function Rmul(a,b){return R(a.n*b.n,a.d*b.d);} function Radd(a,b){return R(a.n*b.d+b.n*a.d,a.d*b.d);}
function Rsub(a,b){return R(a.n*b.d-b.n*a.d,a.d*b.d);} function Rdiv(a,b){return R(a.n*b.d,a.d*b.n);}
function Rv(a){return a.n/a.d;}
function terminating(d){while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1;}
// parts for a rational: decimals allowed if terminating(opt.dec)
function Rparts(r,color,opt){opt=opt||{};
  if(r.d===1){const s=minus(r.n);return [[opt.paren&&r.n<0?'('+s+')':s,color]];}
  if(opt.dec&&terminating(r.d)){const s=minus(+(r.n/r.d).toFixed(4));return [[opt.paren&&r.n<0?'('+s+')':s,color]];}
  return fracParts(r.n,r.d,color,opt.paren);
}
// coefficient parts for "a x" : 1 -> '', -1 -> '−'
function coefParts(r,color){ if(r.n===r.d)return []; if(r.n===-r.d)return [['−',color]]; return Rparts(r,color); }


// ---- tiny 3D (z up) for SVG ----
function V3(c,p){const cy=Math.cos(c.yaw),sy=Math.sin(c.yaw);const x1=p[0]*cy-p[1]*sy,y1=p[0]*sy+p[1]*cy;
  const cp=Math.cos(c.pitch),sp=Math.sin(c.pitch);return [x1,p[2]*cp+y1*sp,y1*cp-p[2]*sp];}
function PJ(c,p){const v=V3(c,p);return [c.cx+v[0]*c.s,c.cy-v[1]*c.s,v[2]];}
function hex2(h){return [1,3,5].map(i=>parseInt(h.substr(i,2),16));}
function mixc(a,b,k){const A=hex2(a),B=hex2(b);return 'rgb('+A.map((x,i)=>Math.round(x+(B[i]-x)*k)).join(',')+')';}
const LGT=(()=>{const L=[-0.45,0.65,-0.62],n=Math.hypot(...L);return L.map(x=>x/n);})();
function shadeC(c,n,light,dark,twoSided){const v=V3(c,n),nn=Math.hypot(...v)||1;let k=(v[0]*LGT[0]+v[1]*LGT[1]+v[2]*LGT[2])/nn;
  if(twoSided&&v[2]>0)k=-k; k=Math.max(0,Math.min(1,0.5+0.5*k));return mixc(dark,light,k);}
// faces: {p:[[x,y,z]..], n:[nx,ny,nz], light, dark, stroke, sw, cull, two}
function drawFaces(g,c,faces){
  const items=[];
  for(const f of faces){ if(f.cull){const v=V3(c,f.n);if(v[2]>1e-6)continue;}
    const pp=f.p.map(p=>PJ(c,p));let dep=0;pp.forEach(q=>dep+=q[2]);dep/=pp.length;items.push([dep,f,pp]);}
  items.sort((a,b)=>b[0]-a[0]);
  for(const [dep,f,pp] of items){const fill=shadeC(c,f.n,f.light,f.dark,f.two);
    el('polygon',{points:pp.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '),fill,stroke:f.stroke||fill,'stroke-width':f.sw||1,'stroke-linejoin':'round'},g);}
}
function polyline3(g,c,pts,color,w,dash){el('polyline',{points:pts.map(p=>{const q=PJ(c,p);return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' '),fill:'none',stroke:color,'stroke-width':w,'stroke-dasharray':dash||'none','stroke-linecap':'round','stroke-linejoin':'round'},g);}
function circlePts(z,r,n,a0,a1){a0=a0||0;a1=(a1===undefined)?2*Math.PI:a1;const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([r*Math.cos(a),r*Math.sin(a),z]);}return o;}
// rim: front part solid, back part dashed (or hidden)
function rim3(g,c,z,r,color,w,mode){ // mode: 'full' | 'front' | 'frontdash'
  const n=72;for(let i=0;i<n;i++){const a0=2*Math.PI*i/n,a1=2*Math.PI*(i+1)/n,am=(a0+a1)/2;
    const front=V3(c,[Math.cos(am),Math.sin(am),0])[2]<0;
    if(mode==='full'||front)polyline3(g,c,[[r*Math.cos(a0),r*Math.sin(a0),z],[r*Math.cos(a1),r*Math.sin(a1),z]],color,w);
    else if(mode==='frontdash'&&i%2===0)polyline3(g,c,[[r*Math.cos(a0),r*Math.sin(a0),z],[r*Math.cos(a1),r*Math.sin(a1),z]],color,w*0.7);}
}
// surface of revolution faces, profile [[r,z]..] ccw (bottom->outer->top)
function revolveFaces(prof,phi0,phi1,n,light,dark,cull){const F=[];const span=phi1-phi0;
  for(let i=0;i<n;i++){const a0=phi0+span*i/n,a1=phi0+span*(i+1)/n,am=(a0+a1)/2;
    for(let j=0;j<prof.length-1;j++){const [r0,z0]=prof[j],[r1,z1]=prof[j+1];if(r0===0&&r1===0)continue;
      const p=[[r0*Math.cos(a0),r0*Math.sin(a0),z0],[r1*Math.cos(a0),r1*Math.sin(a0),z1],[r1*Math.cos(a1),r1*Math.sin(a1),z1],[r0*Math.cos(a1),r0*Math.sin(a1),z0]];
      const dr=r1-r0,dz=z1-z0;F.push({p,n:[dz*Math.cos(am),dz*Math.sin(am),-dr],light,dark,cull,two:!cull});}}
  return F;}
// drag-rotate helper
function orbitHit(area,getCam,setCam){return p=>{ if(!area(p))return null; const c0=getCam(),p0=p;
  return q=>{setCam(c0.yaw-(q.x-p0.x)*0.01,Math.max(-0.2,Math.min(Math.PI/2,c0.pitch+(q.y-p0.y)*0.01)));};};}

const root=el('g',{},svg);
const SH=[ // profiles [r,z] ccw, generator segment index for 母線-like edge
  {nm:'長方形',p:[[0,-1.6],[2,-1.6],[2,1.6],[0,1.6]],rims:[[-1.6,2,'b'],[1.6,2,'t']]},
  {nm:'直角三角形',p:[[0,-1.6],[2,-1.6],[0,1.6]],rims:[[-1.6,2,'b']]},
  {nm:'半円',p:(()=>{const a=[];for(let i=0;i<=24;i++){const t=Math.PI*i/24;a.push([2*Math.sin(t),-2*Math.cos(t)]);}a[0][0]=0;a[24][0]=0;return a;})(),rims:[[0,2,'m']]},
  {nm:'台形',p:[[0,-1.6],[2.2,-1.6],[1.1,1.6],[0,1.6]],rims:[[-1.6,2.2,'b'],[1.6,1.1,'t']]},
];
let st,L,sg=null;
function init(){st={k:0,ai:0,yaw:-0.5,pitch:0.35};}
const NA=25; // 0..360 step 15
function layout(){
  if(isLand()){svg.setAttribute('viewBox','0 0 1600 820');
    L={c:[580,410],s:120,area:[0,0,1150,820],sl:[1180,330,360],ang:[1360,470]};
  } else {svg.setAttribute('viewBox','0 0 1000 1340');
    L={c:[500,520],s:125,area:[0,0,1000,1060],sl:[160,1130,680],ang:[500,1250]};
  }
  draw();
}
function draw(){
  root.innerHTML='';const g=root;const sh=SH[st.k];const ang=st.ai*15,phi=-ang*Math.PI/180;
  const c={cx:L.c[0],cy:L.c[1],s:L.s,yaw:st.yaw,pitch:st.pitch};
  const F=[];
  if(ang>0)F.push(...revolveFaces(sh.p,0,phi,Math.max(6,Math.round(ang/5)),'#cddff8','#5f87c8',false));
  // the plane shape at angle phi (and at 0 as ghost when partially rotated)
  const shp=(ph)=>sh.p.map(([r,z])=>[r*Math.cos(ph),r*Math.sin(ph),z]);
  if(ang<360) F.push({p:shp(phi),n:[-Math.sin(phi),Math.cos(phi),0],light:'#fcd6b4',dark:'#f3b07a',stroke:COL.orange,sw:4,two:true});
  drawFaces(g,c,F);
  if(ang===360){ sh.rims.forEach(([z,r,t])=>rim3(g,c,z,r,COL.blue,3,t==='t'?(st.pitch>0?'full':'frontdash'):(st.pitch>0?'frontdash':'full'))); }
  // axis
  const top=PJ(c,[0,0,2.7]),bot=PJ(c,[0,0,-2.7]);
  el('line',{x1:bot[0],y1:bot[1],x2:top[0],y2:top[1],stroke:COL.black,'stroke-width':4},g);
  T(g,top[0]+SZ(26),top[1],'ℓ',SZ(36),COL.black);
  // panel
  sg=SLIDER(g,...L.sl,NA,st.ai);
  T(g,L.ang[0],L.ang[1],ang+'°',SZ('big'),COL.blue);
  TOOLBAR([...SH.map((s,i)=>({t:s.nm,on:st.k===i,fn:()=>{st.k=i;draw();}})),{t:'リセット',sep:true,fn:()=>{init();draw();}}]);
}
HITS.push(p=>sliderHit(sg,i=>{if(i!==st.ai){st.ai=i;draw();}})(p));
HITS.push(orbitHit(p=>p.x>=L.area[0]&&p.x<=L.area[2]&&p.y>=L.area[1]&&p.y<=L.area[3],()=>({yaw:st.yaw,pitch:st.pitch}),(y,pt)=>{st.yaw=y;st.pitch=pt;draw();}));
addEventListener('resize',layout);
init();layout();

</script>
</body>
</html>
